<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline di qualità locale del pacchetto TPSI</title>
  <desc id="desc">La modifica viene controllata localmente con validazione strutturale, test, compilazione, sanitizer e prova docente; i risultati producono evidenze per la review, ma una pipeline verde non sostituisce la validazione didattica.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 21px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:18px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.step{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.tool{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.ok{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.manual{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.limit{fill:#FEF2F2;stroke:#B91C1C;stroke-width:3}</style></defs>
  <rect width="1400" height="780" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Qualità del pacchetto: controlli automatici locali + revisione umana</text>
  <rect class="step" x="55" y="170" width="190" height="120" rx="20"/><text class="h" x="150" y="215" text-anchor="middle">MODIFICA</text><text class="b" x="150" y="250" text-anchor="middle">contenuto, activity</text><text class="b" x="150" y="278" text-anchor="middle">o diagramma</text>
  <rect class="tool" x="285" y="170" width="190" height="120" rx="20"/><text class="h" x="380" y="215" text-anchor="middle">VALIDATORI</text><text class="b" x="380" y="250" text-anchor="middle">JSON, path, XML</text><text class="b" x="380" y="278" text-anchor="middle">link e metadati</text>
  <rect class="tool" x="515" y="170" width="190" height="120" rx="20"/><text class="h" x="610" y="215" text-anchor="middle">TEST</text><text class="b" x="610" y="250" text-anchor="middle">pytest e casi</text><text class="b" x="610" y="278" text-anchor="middle">di regressione</text>
  <rect class="tool" x="745" y="170" width="190" height="120" rx="20"/><text class="h" x="840" y="215" text-anchor="middle">TOOLCHAIN</text><text class="b" x="840" y="250" text-anchor="middle">GCC, warning</text><text class="b" x="840" y="278" text-anchor="middle">sanitizer</text>
  <rect class="manual" x="975" y="170" width="190" height="120" rx="20"/><text class="h" x="1070" y="215" text-anchor="middle">PROVA REALE</text><text class="b" x="1070" y="250" text-anchor="middle">docente/studente</text><text class="b" x="1070" y="278" text-anchor="middle">accessibilità</text>
  <path d="M245 230 H285 M475 230 H515 M705 230 H745 M935 230 H975" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <rect class="ok" x="455" y="410" width="490" height="135" rx="24"/><text class="h" x="700" y="455" text-anchor="middle">EVIDENZE PER LA REVIEW</text><text class="b" x="700" y="493" text-anchor="middle">report, output, diff, limiti e risultati riproducibili</text><text class="b" x="700" y="522" text-anchor="middle">eseguiti localmente, senza GitHub Actions private</text>
  <path d="M380 290 C380 365 535 370 565 410 M610 290 V410 M840 290 C840 365 760 370 750 410 M1070 290 C1070 370 865 375 835 410" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect class="limit" x="250" y="625" width="900" height="95" rx="22"/><text class="h" x="700" y="664" text-anchor="middle">Una suite verde dimostra soltanto che sono passati i controlli configurati.</text><text class="b" x="700" y="697" text-anchor="middle">Non prova da sola completezza dei requisiti, efficacia didattica o assenza di ogni difetto.</text>
  <path d="M700 545 V625" stroke="#B91C1C" stroke-width="5" marker-end="url(#a)"/>
</svg>