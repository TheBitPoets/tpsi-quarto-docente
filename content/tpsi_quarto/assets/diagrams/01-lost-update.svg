<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Interleaving che produce un incremento perso</title>
  <desc id="desc">Due thread leggono entrambi il valore zero, calcolano uno e scrivono uno: due incrementi logici producono un solo incremento osservabile a causa della race condition.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 23px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:20px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.a{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.bb{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.bad{fill:#FEF2F2;stroke:#B91C1C;stroke-width:3}.mem{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}</style></defs>
  <rect width="1400" height="780" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Race condition: due incrementi, un solo risultato</text>
  <text class="h" x="215" y="115" text-anchor="middle">Thread A</text><text class="h" x="700" y="115" text-anchor="middle">Variabile condivisa x</text><text class="h" x="1185" y="115" text-anchor="middle">Thread B</text>
  <line x1="215" y1="145" x2="215" y2="690" stroke="#2563EB" stroke-width="5"/><line x1="700" y1="145" x2="700" y2="690" stroke="#0F766E" stroke-width="5"/><line x1="1185" y1="145" x2="1185" y2="690" stroke="#7C3AED" stroke-width="5"/>
  <rect class="mem" x="615" y="150" width="170" height="80" rx="18"/><text class="h" x="700" y="200" text-anchor="middle">x = 0</text>
  <rect class="a" x="80" y="250" width="270" height="85" rx="18"/><text class="b" x="215" y="286" text-anchor="middle">A1: legge x</text><text class="b" x="215" y="316" text-anchor="middle">valore locale = 0</text><path d="M350 292 H615" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect class="bb" x="1050" y="350" width="270" height="85" rx="18"/><text class="b" x="1185" y="386" text-anchor="middle">B1: legge x</text><text class="b" x="1185" y="416" text-anchor="middle">valore locale = 0</text><path d="M1050 392 H785" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect class="a" x="80" y="450" width="270" height="75" rx="18"/><text class="b" x="215" y="496" text-anchor="middle">A2: calcola 0 + 1</text>
  <rect class="bb" x="1050" y="450" width="270" height="75" rx="18"/><text class="b" x="1185" y="496" text-anchor="middle">B2: calcola 0 + 1</text>
  <rect class="a" x="80" y="565" width="270" height="75" rx="18"/><text class="b" x="215" y="611" text-anchor="middle">A3: scrive 1</text><path d="M350 602 H615" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <rect class="bb" x="1050" y="650" width="270" height="75" rx="18"/><text class="b" x="1185" y="696" text-anchor="middle">B3: scrive 1</text><path d="M1050 687 H785" stroke="#7C3AED" stroke-width="4" marker-end="url(#a)"/>
  <rect class="bad" x="555" y="555" width="290" height="170" rx="22"/><text class="h" x="700" y="602" text-anchor="middle">Risultato finale: x = 1</text><text class="b" x="700" y="645" text-anchor="middle">Atteso: x = 2</text><text class="b" x="700" y="684" text-anchor="middle">Un aggiornamento è stato perso</text>
</svg>