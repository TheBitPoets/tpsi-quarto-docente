<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Catena di tracciabilità dei requisiti</title>
  <desc id="desc">Un bisogno genera un requisito, il requisito viene descritto in un caso d'uso, realizzato da un componente, verificato da activity e test, e produce un risultato osservabile. Le frecce inverse consentono di risalire alla motivazione.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2563EB"/></marker>
    <marker id="arrowBack" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12 0 L0 6 L12 12 z" fill="#64748B"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1500" height="620" rx="28" fill="#F8FAFC"/>
  <text x="70" y="76" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#0F172A">Dal bisogno all’evidenza: tracciabilità end-to-end</text>
  <text x="70" y="114" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" fill="#475569">Ogni artefatto deve poter spiegare che cosa realizza e perché esiste.</text>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 220)">
      <rect width="205" height="150" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
      <text x="102" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Bisogno</text>
      <text x="102" y="101" text-anchor="middle" font-size="18" fill="#475569">problema o obiettivo</text>
    </g>
    <g transform="translate(295 220)">
      <rect width="205" height="150" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
      <text x="102" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Requisito</text>
      <text x="102" y="101" text-anchor="middle" font-size="18" fill="#475569">capacità verificabile</text>
    </g>
    <g transform="translate(535 220)">
      <rect width="205" height="150" rx="24" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
      <text x="102" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Caso d’uso</text>
      <text x="102" y="101" text-anchor="middle" font-size="18" fill="#475569">attore e scenario</text>
    </g>
    <g transform="translate(775 220)">
      <rect width="205" height="150" rx="24" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/>
      <text x="102" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Componente</text>
      <text x="102" y="101" text-anchor="middle" font-size="18" fill="#475569">responsabilità tecnica</text>
    </g>
    <g transform="translate(1015 220)">
      <rect width="205" height="150" rx="24" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
      <text x="102" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="#0F172A">Activity / test</text>
      <text x="102" y="95" text-anchor="middle" font-size="18" fill="#475569">prova e criterio</text>
      <text x="102" y="121" text-anchor="middle" font-size="18" fill="#475569">di accettazione</text>
    </g>
    <g transform="translate(1255 220)">
      <rect width="190" height="150" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
      <text x="95" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Risultato</text>
      <text x="95" y="101" text-anchor="middle" font-size="18" fill="#475569">evidenza osservabile</text>
    </g>
  </g>

  <g fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)">
    <path d="M260 295 H287"/><path d="M500 295 H527"/><path d="M740 295 H767"/><path d="M980 295 H1007"/><path d="M1220 295 H1247"/>
  </g>

  <path d="M1348 410 C1200 535 300 535 158 410" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrowBack)"/>
  <text x="750" y="515" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">Tracciabilità inversa: dal risultato si risale a test, implementazione, requisito e bisogno</text>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <rect x="220" y="415" width="1060" height="58" rx="16" fill="#E2E8F0"/>
    <text x="750" y="452" text-anchor="middle" font-size="20" fill="#334155">Quando un requisito cambia, questa catena identifica documenti, codice, activity e test da riesaminare.</text>
  </g>
</svg>
