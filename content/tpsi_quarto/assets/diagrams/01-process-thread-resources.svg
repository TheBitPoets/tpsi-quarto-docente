<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Risorse di processi distinti e thread dello stesso processo</title>
  <desc id="desc">Confronto tra due processi con memoria isolata e due thread che condividono codice, heap e descrittori, mantenendo stack e contesto separati.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
    <style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 24px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:20px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.box{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:3}.private{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.shared{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.thread{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}</style>
  </defs>
  <rect width="1400" height="760" fill="#F8FAFC"/>
  <text class="t" x="700" y="54" text-anchor="middle">Processi separati e thread: cosa è privato e cosa è condiviso</text>
  <rect class="box" x="55" y="95" width="615" height="610" rx="26"/>
  <text class="h" x="362" y="140" text-anchor="middle">Due processi distinti</text>
  <rect class="private" x="95" y="180" width="250" height="460" rx="20"/>
  <text class="h" x="220" y="222" text-anchor="middle">Processo A</text>
  <text class="b" x="125" y="275">• spazio indirizzi</text><text class="b" x="125" y="320">• heap</text><text class="b" x="125" y="365">• stack</text><text class="b" x="125" y="410">• descrittori</text><text class="b" x="125" y="455">• contesto CPU</text>
  <rect class="private" x="380" y="180" width="250" height="460" rx="20"/>
  <text class="h" x="505" y="222" text-anchor="middle">Processo B</text>
  <text class="b" x="410" y="275">• spazio indirizzi</text><text class="b" x="410" y="320">• heap</text><text class="b" x="410" y="365">• stack</text><text class="b" x="410" y="410">• descrittori</text><text class="b" x="410" y="455">• contesto CPU</text>
  <path d="M345 520 H380" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text class="b" x="362" y="565" text-anchor="middle">Comunicazione esplicita</text><text class="b" x="362" y="596" text-anchor="middle">pipe, socket, memoria condivisa…</text>
  <rect class="box" x="730" y="95" width="615" height="610" rx="26"/>
  <text class="h" x="1037" y="140" text-anchor="middle">Due thread nello stesso processo</text>
  <rect class="shared" x="775" y="180" width="525" height="175" rx="20"/>
  <text class="h" x="1037" y="222" text-anchor="middle">Risorse condivise</text>
  <text class="b" x="820" y="270">codice</text><text class="b" x="965" y="270">heap</text><text class="b" x="1090" y="270">globali</text><text class="b" x="1200" y="270">file</text>
  <text class="b" x="1037" y="320" text-anchor="middle">Accesso rapido, ma richiede sincronizzazione</text>
  <rect class="thread" x="790" y="405" width="225" height="225" rx="20"/>
  <text class="h" x="902" y="448" text-anchor="middle">Thread 1</text><text class="b" x="825" y="500">• stack proprio</text><text class="b" x="825" y="545">• registri propri</text><text class="b" x="825" y="590">• stato proprio</text>
  <rect class="thread" x="1055" y="405" width="225" height="225" rx="20"/>
  <text class="h" x="1167" y="448" text-anchor="middle">Thread 2</text><text class="b" x="1090" y="500">• stack proprio</text><text class="b" x="1090" y="545">• registri propri</text><text class="b" x="1090" y="590">• stato proprio</text>
  <path d="M902 405 V355 M1167 405 V355" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
</svg>