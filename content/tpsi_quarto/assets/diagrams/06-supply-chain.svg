<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Supply chain del software</title>
  <desc id="desc">Fonti e dipendenze entrano nella build, producono un artefatto che viene testato e distribuito; versioni, digest, privilegi minimi e possibilità di rollback proteggono ogni passaggio.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 21px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:18px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.src{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.build{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.art{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.ok{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.risk{fill:#FEF2F2;stroke:#B91C1C;stroke-width:3}</style></defs>
  <rect width="1400" height="780" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Supply chain: proteggere ciò che entra e ciò che viene distribuito</text>
  <rect class="src" x="45" y="170" width="210" height="170" rx="22"/><text class="h" x="150" y="213" text-anchor="middle">FONTI</text><text class="b" x="150" y="250" text-anchor="middle">repository</text><text class="b" x="150" y="282" text-anchor="middle">codice e contenuti</text><text class="b" x="150" y="314" text-anchor="middle">commit verificato</text>
  <rect class="src" x="290" y="170" width="210" height="170" rx="22"/><text class="h" x="395" y="213" text-anchor="middle">DIPENDENZE</text><text class="b" x="395" y="250" text-anchor="middle">librerie</text><text class="b" x="395" y="282" text-anchor="middle">container e tool</text><text class="b" x="395" y="314" text-anchor="middle">versioni fissate</text>
  <rect class="build" x="550" y="170" width="210" height="170" rx="22"/><text class="h" x="655" y="213" text-anchor="middle">BUILD</text><text class="b" x="655" y="250" text-anchor="middle">ambiente isolato</text><text class="b" x="655" y="282" text-anchor="middle">privilegi minimi</text><text class="b" x="655" y="314" text-anchor="middle">log controllati</text>
  <rect class="art" x="810" y="170" width="210" height="170" rx="22"/><text class="h" x="915" y="213" text-anchor="middle">ARTEFATTO</text><text class="b" x="915" y="250" text-anchor="middle">pacchetto / immagine</text><text class="b" x="915" y="282" text-anchor="middle">digest</text><text class="b" x="915" y="314" text-anchor="middle">provenienza</text>
  <rect class="ok" x="1070" y="170" width="285" height="170" rx="22"/><text class="h" x="1212" y="213" text-anchor="middle">TEST E DISTRIBUZIONE</text><text class="b" x="1212" y="250" text-anchor="middle">prova dell'artefatto reale</text><text class="b" x="1212" y="282" text-anchor="middle">canale autorizzato</text><text class="b" x="1212" y="314" text-anchor="middle">rollback</text>
  <path d="M255 255 H290 M500 255 H550 M760 255 H810 M1020 255 H1070" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <rect class="risk" x="120" y="500" width="1160" height="125" rx="24"/><text class="h" x="700" y="545" text-anchor="middle">Rischi lungo tutta la catena</text><text class="b" x="700" y="582" text-anchor="middle">dipendenza compromessa • nome simile • tag modificabile • script non verificato • artefatto diverso da quello testato</text>
  <path d="M150 340 C150 430 220 450 260 500 M395 340 V500 M655 340 V500 M915 340 V500 M1212 340 C1212 430 1150 450 1110 500" stroke="#B91C1C" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <text class="b" x="700" y="690" text-anchor="middle">Contromisure: fonti ufficiali, versioni e digest, review, aggiornamenti intenzionali, segreti separati e rollback provato.</text><text class="b" x="700" y="728" text-anchor="middle">La sicurezza non finisce nel codice scritto direttamente dal progetto.</text>
</svg>