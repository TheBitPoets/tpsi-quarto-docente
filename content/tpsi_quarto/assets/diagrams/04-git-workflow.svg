<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Flusso Git con branch, commit, pull request e review</title>
  <desc id="desc">Il lavoro parte da una issue, prosegue su un branch con commit intenzionali, apre una pull request, riceve test e review, applica correzioni e viene unito oppure rimandato.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 22px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:18px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.step{fill:#FFFFFF;stroke:#2563EB;stroke-width:3}.review{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.ok{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.loop{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}</style></defs>
  <rect width="1400" height="760" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Git e pull request: storia, verifica e collaborazione</text>
  <rect class="step" x="55" y="210" width="190" height="120" rx="20"/><text class="h" x="150" y="252" text-anchor="middle">Issue</text><text class="b" x="150" y="288" text-anchor="middle">problema, requisito</text><text class="b" x="150" y="316" text-anchor="middle">criteri</text>
  <rect class="step" x="295" y="210" width="190" height="120" rx="20"/><text class="h" x="390" y="252" text-anchor="middle">Branch</text><text class="b" x="390" y="288" text-anchor="middle">isola lo scopo</text><text class="b" x="390" y="316" text-anchor="middle">del lavoro</text>
  <rect class="step" x="535" y="210" width="190" height="120" rx="20"/><text class="h" x="630" y="252" text-anchor="middle">Commit</text><text class="b" x="630" y="288" text-anchor="middle">modifiche coerenti</text><text class="b" x="630" y="316" text-anchor="middle">e spiegabili</text>
  <rect class="step" x="775" y="210" width="190" height="120" rx="20"/><text class="h" x="870" y="252" text-anchor="middle">Pull request</text><text class="b" x="870" y="288" text-anchor="middle">diff, impatto</text><text class="b" x="870" y="316" text-anchor="middle">e verifiche</text>
  <rect class="review" x="1015" y="185" width="250" height="170" rx="22"/><text class="h" x="1140" y="230" text-anchor="middle">Test + review</text><text class="b" x="1140" y="270" text-anchor="middle">errori bloccanti</text><text class="b" x="1140" y="302" text-anchor="middle">rischi e suggerimenti</text><text class="b" x="1140" y="334" text-anchor="middle">evidenze</text>
  <path d="M245 270 H295 M485 270 H535 M725 270 H775 M965 270 H1015" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <polygon class="loop" points="1140,430 1270,520 1140,610 1010,520"/><text class="h" x="1140" y="505" text-anchor="middle">Pronta?</text><text class="b" x="1140" y="540" text-anchor="middle">criteri soddisfatti</text>
  <path d="M1140 355 V430" stroke="#B45309" stroke-width="5" marker-end="url(#a)"/>
  <rect class="ok" x="760" y="500" width="210" height="120" rx="20"/><text class="h" x="865" y="545" text-anchor="middle">Merge</text><text class="b" x="865" y="582" text-anchor="middle">storia approvata</text>
  <path d="M1010 520 H970" stroke="#0F766E" stroke-width="5" marker-end="url(#a)"/><text class="b" x="990" y="495" text-anchor="middle">sì</text>
  <path d="M1140 610 C1140 700 630 700 630 330" stroke="#7C3AED" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/><text class="b" x="840" y="690" text-anchor="middle">no: correggi, aggiungi test, crea nuovi commit</text>
  <text class="b" x="700" y="115" text-anchor="middle">Ogni passaggio conserva il collegamento fra motivazione, modifica, prova e decisione.</text>
</svg>