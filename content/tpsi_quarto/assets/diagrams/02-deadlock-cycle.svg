<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo di attesa che produce un deadlock</title>
  <desc id="desc">Il thread A possiede il lock X e attende Y. Il thread B possiede il lock Y e attende X. Le quattro dipendenze formano un ciclo senza avanzamento.</desc>
  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#B91C1C"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2563EB"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#F8FAFC"/>
  <text x="70" y="74" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#0F172A">Deadlock: ciclo di possesso e attesa</text>
  <text x="70" y="112" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" fill="#475569">Ogni thread conserva un lock mentre attende quello posseduto dall’altro.</text>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="120" y="245" width="310" height="190" rx="30" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="275" y="315" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">Thread A</text>
    <text x="275" y="360" text-anchor="middle" font-size="21" fill="#334155">possiede X</text>
    <text x="275" y="396" text-anchor="middle" font-size="21" font-weight="700" fill="#B91C1C">attende Y</text>

    <rect x="970" y="245" width="310" height="190" rx="30" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <text x="1125" y="315" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">Thread B</text>
    <text x="1125" y="360" text-anchor="middle" font-size="21" fill="#334155">possiede Y</text>
    <text x="1125" y="396" text-anchor="middle" font-size="21" font-weight="700" fill="#B91C1C">attende X</text>

    <circle cx="700" cy="220" r="95" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="700" y="210" text-anchor="middle" font-size="31" font-weight="700" fill="#0F172A">Lock X</text>
    <text x="700" y="249" text-anchor="middle" font-size="19" fill="#334155">assegnato ad A</text>

    <circle cx="700" cy="520" r="95" fill="#F5F3FF" stroke="#7C3AED" stroke-width="4"/>
    <text x="700" y="510" text-anchor="middle" font-size="31" font-weight="700" fill="#0F172A">Lock Y</text>
    <text x="700" y="549" text-anchor="middle" font-size="19" fill="#334155">assegnato a B</text>
  </g>

  <g fill="none" stroke-width="6">
    <path d="M430 285 C505 230 550 215 594 215" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
    <path d="M806 215 C860 215 910 235 970 285" stroke="#B91C1C" stroke-dasharray="12 8" marker-end="url(#arrowRed)"/>
    <path d="M970 395 C905 460 860 500 806 515" stroke="#7C3AED" marker-end="url(#arrowBlue)"/>
    <path d="M594 515 C530 500 485 460 430 395" stroke="#B91C1C" stroke-dasharray="12 8" marker-end="url(#arrowRed)"/>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
    <text x="500" y="226" fill="#2563EB">possiede</text>
    <text x="900" y="226" fill="#B91C1C">attende</text>
    <text x="900" y="505" fill="#7C3AED">possiede</text>
    <text x="500" y="505" fill="#B91C1C">attende</text>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <rect x="250" y="635" width="900" height="76" rx="18" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/>
    <text x="700" y="667" text-anchor="middle" font-size="23" font-weight="700" fill="#7F1D1D">Nessun nodo può avanzare: la catena di attese torna al punto di partenza.</text>
    <text x="700" y="696" text-anchor="middle" font-size="18" fill="#7F1D1D">Prevenzione tipica: acquisire sempre i lock secondo un ordine globale X → Y.</text>
  </g>
</svg>
