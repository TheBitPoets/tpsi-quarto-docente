<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Quattro ruoli della provenienza nel corso TPSI</title>
  <desc id="desc">Il libro adottato è riferimento curricolare, la dispensa Linux è fonte tecnica, i moduli sono contenuti originali e il docente revisiona e approva prima della pubblicazione agli studenti.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 22px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:18px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.cur{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.tech{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.orig{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.rev{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.out{fill:#FFFFFF;stroke:#0F172A;stroke-width:3}</style></defs>
  <rect width="1400" height="780" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Ogni elemento ha un ruolo diverso: non confondere fonte e contenuto</text>
  <rect class="cur" x="70" y="155" width="285" height="230" rx="26"/><text class="h" x="212" y="205" text-anchor="middle">1. LIBRO ADOTTATO</text><text class="b" x="212" y="250" text-anchor="middle">riferimento curricolare</text><text class="b" x="212" y="285" text-anchor="middle">indice e copertura</text><text class="b" x="212" y="320" text-anchor="middle">testo non importato</text><text class="b" x="212" y="355" text-anchor="middle">reference-only</text>
  <rect class="tech" x="385" y="155" width="285" height="230" rx="26"/><text class="h" x="527" y="205" text-anchor="middle">2. FONTE TECNICA</text><text class="b" x="527" y="250" text-anchor="middle">LINUX_PROGRAMMING.md</text><text class="b" x="527" y="285" text-anchor="middle">documentazione ufficiale</text><text class="b" x="527" y="320" text-anchor="middle">locator e versione</text><text class="b" x="527" y="355" text-anchor="middle">licenza verificata</text>
  <rect class="orig" x="730" y="155" width="285" height="230" rx="26"/><text class="h" x="872" y="205" text-anchor="middle">3. CONTENUTO ORIGINALE</text><text class="b" x="872" y="250" text-anchor="middle">spiegazioni nuove</text><text class="b" x="872" y="285" text-anchor="middle">esempi e activity</text><text class="b" x="872" y="320" text-anchor="middle">diagrammi originali</text><text class="b" x="872" y="355" text-anchor="middle">stato draft/reviewed</text>
  <rect class="rev" x="1045" y="155" width="285" height="230" rx="26"/><text class="h" x="1187" y="205" text-anchor="middle">4. REVISIONE DOCENTE</text><text class="b" x="1187" y="250" text-anchor="middle">correttezza tecnica</text><text class="b" x="1187" y="285" text-anchor="middle">qualità didattica</text><text class="b" x="1187" y="320" text-anchor="middle">licenze e accessibilità</text><text class="b" x="1187" y="355" text-anchor="middle">approvazione finale</text>
  <path d="M355 270 H385 M670 270 H730 M1015 270 H1045" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <rect class="out" x="360" y="505" width="680" height="145" rx="26"/><text class="h" x="700" y="550" text-anchor="middle">LEZIONE PUBBLICATA ALLA CLASSE</text><text class="b" x="700" y="590" text-anchor="middle">copertura dichiarata + fonti verificabili + trasformazione originale</text><text class="b" x="700" y="625" text-anchor="middle">+ decisione umana tracciata</text>
  <path d="M212 385 C212 470 450 470 500 505 M527 385 C527 460 590 470 610 505 M872 385 C872 460 810 470 790 505 M1187 385 C1187 470 950 470 900 505" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#a)"/>
  <text class="b" x="700" y="720" text-anchor="middle">Il modello impedisce di attribuire al libro testi originali o di trattare l'AI come fonte primaria.</text>
</svg>