<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Uso responsabile dell'intelligenza artificiale nel corso</title>
  <desc id="desc">Fonti verificabili e dati minimizzati entrano nel compito; l'AI produce una bozza, il docente controlla fatti, codice, licenze e accessibilità, esegue test e decide se approvare o scartare.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 21px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:18px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.src{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.ai{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.review{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.ok{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.bad{fill:#FEF2F2;stroke:#B91C1C;stroke-width:3}</style></defs>
  <rect width="1400" height="790" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">AI responsabile: la bozza non è il risultato finale</text>
  <rect class="src" x="55" y="155" width="240" height="190" rx="24"/><text class="h" x="175" y="200" text-anchor="middle">INPUT CONTROLLATO</text><text class="b" x="175" y="240" text-anchor="middle">fonti identificate</text><text class="b" x="175" y="273" text-anchor="middle">dati minimizzati</text><text class="b" x="175" y="306" text-anchor="middle">obiettivo e policy</text>
  <rect class="ai" x="355" y="155" width="240" height="190" rx="24"/><text class="h" x="475" y="200" text-anchor="middle">MODELLO AI</text><text class="b" x="475" y="240" text-anchor="middle">genera una bozza</text><text class="b" x="475" y="273" text-anchor="middle">può sbagliare</text><text class="b" x="475" y="306" text-anchor="middle">non è fonte primaria</text>
  <rect class="review" x="655" y="125" width="300" height="250" rx="24"/><text class="h" x="805" y="172" text-anchor="middle">REVISIONE UMANA</text><text class="b" x="805" y="213" text-anchor="middle">verifica fatti e fonti</text><text class="b" x="805" y="246" text-anchor="middle">prova codice e test</text><text class="b" x="805" y="279" text-anchor="middle">controlla licenze e privacy</text><text class="b" x="805" y="312" text-anchor="middle">adatta linguaggio/accessibilità</text><text class="b" x="805" y="345" text-anchor="middle">registra trasformazioni</text>
  <polygon class="review" points="1110,145 1280,250 1110,355 940,250"/><text class="h" x="1110" y="235" text-anchor="middle">APPROVABILE?</text><text class="b" x="1110" y="270" text-anchor="middle">evidenze sufficienti</text>
  <path d="M295 250 H355 M595 250 H655 M955 250 H940" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <rect class="ok" x="1015" y="485" width="300" height="140" rx="24"/><text class="h" x="1165" y="532" text-anchor="middle">PUBBLICAZIONE</text><text class="b" x="1165" y="570" text-anchor="middle">contenuto approvato</text><text class="b" x="1165" y="602" text-anchor="middle">con provenienza e stato</text>
  <path d="M1110 355 V485" stroke="#0F766E" stroke-width="5" marker-end="url(#a)"/><text class="b" x="1135" y="430">sì</text>
  <rect class="bad" x="530" y="500" width="330" height="140" rx="24"/><text class="h" x="695" y="547" text-anchor="middle">SCARTA O RIELABORA</text><text class="b" x="695" y="585" text-anchor="middle">errore, fonte mancante</text><text class="b" x="695" y="617" text-anchor="middle">rischio privacy/licenza</text>
  <path d="M940 250 C870 250 900 500 860 545" stroke="#B91C1C" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/><text class="b" x="905" y="405" text-anchor="middle">no</text>
  <path d="M530 570 C365 570 350 345 430 345" stroke="#7C3AED" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <rect class="src" x="80" y="500" width="330" height="140" rx="24"/><text class="h" x="245" y="547" text-anchor="middle">REGISTRO</text><text class="b" x="245" y="585" text-anchor="middle">modello/data, obiettivo</text><text class="b" x="245" y="617" text-anchor="middle">fonti, revisioni e test</text>
  <path d="M805 375 C805 445 410 460 360 500" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#a)"/>
  <text class="b" x="700" y="720" text-anchor="middle">La responsabilità della decisione resta umana; segreti e dati personali non vengono inviati senza necessità e protezioni.</text>
</svg>