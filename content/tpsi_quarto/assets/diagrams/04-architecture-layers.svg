<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Architettura a livelli di TheBitLab</title>
  <desc id="desc">La GUI docente comunica con API locali, che delegano al service layer. Il service layer usa tre porte separate: storage, repository provider e servizi di grading o intelligenza artificiale.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2563EB"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1400" height="820" rx="28" fill="#F8FAFC"/>
  <text x="70" y="74" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#0F172A">Architettura a livelli e responsabilità separate</text>
  <text x="70" y="112" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" fill="#475569">L’interfaccia non accede direttamente a file, provider esterni o runner tecnici.</text>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="390" y="165" width="620" height="110" rx="26" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <text x="700" y="214" text-anchor="middle" font-size="31" font-weight="700" fill="#0F172A">GUI docente</text>
    <text x="700" y="249" text-anchor="middle" font-size="19" fill="#475569">Course Board, dashboard activity e revisione consegne</text>

    <rect x="390" y="330" width="620" height="110" rx="26" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="700" y="379" text-anchor="middle" font-size="31" font-weight="700" fill="#0F172A">API locali / server HTTP</text>
    <text x="700" y="414" text-anchor="middle" font-size="19" fill="#475569">autenticazione, validazione del trasporto, mapping delle richieste</text>

    <rect x="390" y="495" width="620" height="110" rx="26" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <text x="700" y="544" text-anchor="middle" font-size="31" font-weight="700" fill="#0F172A">Service layer</text>
    <text x="700" y="579" text-anchor="middle" font-size="19" fill="#475569">regole applicative, casi d’uso e coordinamento del dominio</text>
  </g>

  <g fill="none" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)">
    <path d="M700 275 V320"/>
    <path d="M700 440 V485"/>
    <path d="M545 605 V660"/>
    <path d="M700 605 V660"/>
    <path d="M855 605 V660"/>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="120" y="665" width="350" height="110" rx="24" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/>
    <text x="295" y="713" text-anchor="middle" font-size="27" font-weight="700" fill="#0F172A">Storage</text>
    <text x="295" y="749" text-anchor="middle" font-size="18" fill="#475569">JSON oggi, SQLite o altri backend domani</text>

    <rect x="525" y="665" width="350" height="110" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <text x="700" y="713" text-anchor="middle" font-size="27" font-weight="700" fill="#0F172A">Repository provider</text>
    <text x="700" y="749" text-anchor="middle" font-size="18" fill="#475569">GitHub, GitLab, locale, provider interno</text>

    <rect x="930" y="665" width="350" height="110" rx="24" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
    <text x="1105" y="713" text-anchor="middle" font-size="27" font-weight="700" fill="#0F172A">Servizi tecnici</text>
    <text x="1105" y="749" text-anchor="middle" font-size="18" fill="#475569">grading, Docker, AI e toolchain</text>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <rect x="70" y="170" width="250" height="420" rx="22" fill="#E2E8F0"/>
    <text x="195" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Confini negativi</text>
    <text x="95" y="270" font-size="19" fill="#334155">La GUI non:</text>
    <text x="110" y="310" font-size="18" fill="#334155">• legge file direttamente</text>
    <text x="110" y="347" font-size="18" fill="#334155">• chiama GitHub direttamente</text>
    <text x="110" y="384" font-size="18" fill="#334155">• esegue il grader</text>
    <text x="110" y="421" font-size="18" fill="#334155">• decide regole di dominio</text>
    <text x="95" y="478" font-size="19" fill="#334155">Il server HTTP non:</text>
    <text x="110" y="518" font-size="18" fill="#334155">• persiste fuori dallo storage</text>
    <text x="110" y="555" font-size="18" fill="#334155">• duplica la logica dei servizi</text>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <rect x="1080" y="170" width="250" height="420" rx="22" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
    <text x="1205" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Vantaggio</text>
    <text x="1105" y="275" font-size="18" fill="#334155">La stessa logica può servire:</text>
    <text x="1120" y="316" font-size="18" fill="#334155">• GUI docente</text>
    <text x="1120" y="353" font-size="18" fill="#334155">• dashboard studente</text>
    <text x="1120" y="390" font-size="18" fill="#334155">• CLI / TUI</text>
    <text x="1120" y="427" font-size="18" fill="#334155">• API future</text>
    <text x="1105" y="483" font-size="18" fill="#334155">Provider e storage possono</text>
    <text x="1105" y="514" font-size="18" fill="#334155">cambiare senza riscrivere</text>
    <text x="1105" y="545" font-size="18" fill="#334155">l’esperienza utente.</text>
  </g>
</svg>
