<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo di vita semplificato di un processo</title>
  <desc id="desc">Il processo passa da nuovo a pronto, quindi in esecuzione. Può terminare oppure entrare in attesa; quando l'evento atteso avviene torna pronto.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="700" rx="28" fill="#F8FAFC"/>
  <text x="70" y="78" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#0F172A">Ciclo di vita di un processo</text>
  <text x="70" y="116" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" fill="#475569">Modello didattico semplificato: pianificazione, attesa e completamento</text>

  <g filter="url(#shadow)" font-family="system-ui,Segoe UI,Arial,sans-serif">
    <rect x="70" y="250" width="220" height="130" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <text x="180" y="308" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Nuovo</text>
    <text x="180" y="344" text-anchor="middle" font-size="19" fill="#475569">strutture in creazione</text>

    <rect x="390" y="250" width="220" height="130" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="500" y="308" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Pronto</text>
    <text x="500" y="344" text-anchor="middle" font-size="19" fill="#475569">attende la CPU</text>

    <rect x="710" y="250" width="250" height="130" rx="24" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <text x="835" y="308" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">In esecuzione</text>
    <text x="835" y="344" text-anchor="middle" font-size="19" fill="#475569">usa un processore</text>

    <rect x="1080" y="250" width="250" height="130" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <text x="1205" y="308" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Terminato</text>
    <text x="1205" y="344" text-anchor="middle" font-size="19" fill="#475569">non esegue più istruzioni</text>

    <rect x="710" y="500" width="250" height="130" rx="24" fill="#FFFFFF" stroke="#B45309" stroke-width="4" stroke-dasharray="12 8"/>
    <text x="835" y="558" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">In attesa</text>
    <text x="835" y="594" text-anchor="middle" font-size="19" fill="#475569">aspetta un evento o dati</text>
  </g>

  <g fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)">
    <path d="M290 315 H382"/>
    <path d="M610 315 H702"/>
    <path d="M960 315 H1072"/>
    <path d="M835 380 V490"/>
    <path id="event-completed" data-connector="true" d="M710 565 C700 565 700 470 620 430 C560 400 500 410 500 390"/>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#334155">
    <text x="336" y="296" text-anchor="middle">ammesso</text>
    <text x="656" y="296" text-anchor="middle">dispatch</text>
    <text x="1018" y="296" text-anchor="middle">fine</text>
    <text x="855" y="444">I/O o evento</text>
    <text x="620" y="418" text-anchor="middle">evento completato</text>
  </g>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <rect id="idea-key-box" data-node="true" x="70" y="530" width="620" height="125" rx="18" fill="#E2E8F0"/>
    <text x="95" y="568" font-size="21" font-weight="700" fill="#0F172A">Idea chiave</text>
    <text id="idea-key-text" data-contained-by="idea-key-box" x="95" y="598" font-size="18" fill="#334155"><tspan x="95" dy="0">“Pronto” non significa “in esecuzione”;</tspan><tspan x="95" dy="28">“in attesa” non consuma CPU in polling continuo.</tspan></text>
  </g>
</svg>
