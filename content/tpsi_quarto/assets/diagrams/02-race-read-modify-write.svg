<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Scomposizione read modify write di counter++</title>
  <desc id="desc">L'operazione counter++ viene mostrata come lettura, calcolo e scrittura; due thread possono intrecciare questi passaggi e sovrascriversi se non esiste sincronizzazione.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 24px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:20px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.step{fill:#FFFFFF;stroke:#2563EB;stroke-width:3}.shared{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.bad{fill:#FEF2F2;stroke:#B91C1C;stroke-width:3}</style></defs>
  <rect width="1400" height="760" fill="#F8FAFC"/><text class="t" x="700" y="56" text-anchor="middle">`counter++` non è necessariamente un'unica azione atomica</text>
  <rect class="shared" x="520" y="105" width="360" height="100" rx="22"/><text class="h" x="700" y="148" text-anchor="middle">Memoria condivisa</text><text class="b" x="700" y="180" text-anchor="middle">counter = 0</text>
  <rect class="step" x="95" y="285" width="300" height="130" rx="22"/><text class="h" x="245" y="330" text-anchor="middle">1. READ</text><text class="b" x="245" y="370" text-anchor="middle">leggi counter in locale</text>
  <rect class="step" x="550" y="285" width="300" height="130" rx="22"/><text class="h" x="700" y="330" text-anchor="middle">2. MODIFY</text><text class="b" x="700" y="370" text-anchor="middle">calcola valore + 1</text>
  <rect class="step" x="1005" y="285" width="300" height="130" rx="22"/><text class="h" x="1155" y="330" text-anchor="middle">3. WRITE</text><text class="b" x="1155" y="370" text-anchor="middle">scrivi il nuovo valore</text>
  <path d="M395 350 H550 M850 350 H1005" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <path d="M700 205 V265 C700 285 245 250 245 285" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1155 415 C1155 495 860 500 800 500" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect class="bad" x="260" y="520" width="880" height="160" rx="24"/><text class="h" x="700" y="565" text-anchor="middle">Finestra di race condition</text><text class="b" x="700" y="605" text-anchor="middle">Un altro thread può eseguire READ e MODIFY prima della WRITE.</text><text class="b" x="700" y="642" text-anchor="middle">Entrambi partono dallo stesso valore e una scrittura può cancellare l'altra.</text>
  <text class="b" x="700" y="722" text-anchor="middle">La sezione critica deve proteggere l'intera operazione logica, non soltanto la scrittura.</text>
</svg>