<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Differenza tra verifica e validazione</title>
  <desc id="desc">La verifica confronta prodotto e specifica per controllare che sia stato costruito correttamente; la validazione confronta prodotto e bisogno per controllare che sia il prodotto giusto.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 23px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:19px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.need{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.spec{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.prod{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.check{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}</style></defs>
  <rect width="1400" height="760" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Verifica e validazione rispondono a domande diverse</text>
  <rect class="need" x="90" y="180" width="300" height="190" rx="26"/><text class="h" x="240" y="225" text-anchor="middle">BISOGNO</text><text class="b" x="240" y="270" text-anchor="middle">problema reale</text><text class="b" x="240" y="305" text-anchor="middle">dello stakeholder</text><text class="b" x="240" y="340" text-anchor="middle">risultato desiderato</text>
  <rect class="spec" x="550" y="180" width="300" height="190" rx="26"/><text class="h" x="700" y="225" text-anchor="middle">SPECIFICA</text><text class="b" x="700" y="270" text-anchor="middle">requisiti</text><text class="b" x="700" y="305" text-anchor="middle">criteri di accettazione</text><text class="b" x="700" y="340" text-anchor="middle">vincoli</text>
  <rect class="prod" x="1010" y="180" width="300" height="190" rx="26"/><text class="h" x="1160" y="225" text-anchor="middle">PRODOTTO</text><text class="b" x="1160" y="270" text-anchor="middle">codice, contenuti</text><text class="b" x="1160" y="305" text-anchor="middle">interfaccia e dati</text><text class="b" x="1160" y="340" text-anchor="middle">in esecuzione</text>
  <path d="M390 275 H550 M850 275 H1010" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <rect class="check" x="775" y="465" width="430" height="155" rx="24"/><text class="h" x="990" y="510" text-anchor="middle">VERIFICA</text><text class="b" x="990" y="550" text-anchor="middle">Il prodotto rispetta la specifica?</text><text class="b" x="990" y="585" text-anchor="middle">«stiamo costruendo bene?»</text>
  <path d="M700 370 C700 440 835 440 870 465 M1160 370 C1160 430 1090 440 1080 465" stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect class="check" x="195" y="465" width="430" height="155" rx="24"/><text class="h" x="410" y="510" text-anchor="middle">VALIDAZIONE</text><text class="b" x="410" y="550" text-anchor="middle">Il prodotto risponde al bisogno?</text><text class="b" x="410" y="585" text-anchor="middle">«stiamo costruendo la cosa giusta?»</text>
  <path d="M240 370 C240 430 320 440 330 465 M1160 370 C1160 690 500 690 490 620" stroke="#B45309" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <text class="b" x="700" y="710" text-anchor="middle">Un prodotto può essere conforme a una specifica sbagliata: servono entrambe le prospettive.</text>
</svg>