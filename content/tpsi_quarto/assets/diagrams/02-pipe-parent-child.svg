<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Pipe unidirezionale tra processo padre e figlio</title>
  <desc id="desc">Il figlio chiude l'estremità di lettura e scrive nella pipe; il padre chiude l'estremità di scrittura, legge il risultato e attende il figlio con waitpid.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 24px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:20px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.p{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.c{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.pipe{fill:#ECFDF5;stroke:#0F766E;stroke-width:4}.closed{fill:#FEF2F2;stroke:#B91C1C;stroke-width:3}</style></defs>
  <rect width="1400" height="760" fill="#F8FAFC"/><text class="t" x="700" y="56" text-anchor="middle">Pipe padre–figlio: direzione, descrittori e chiusure</text>
  <rect class="c" x="70" y="135" width="360" height="500" rx="26"/><text class="h" x="250" y="185" text-anchor="middle">Processo figlio</text>
  <rect class="closed" x="115" y="240" width="270" height="90" rx="18"/><text class="b" x="250" y="278" text-anchor="middle">close(fd[0])</text><text class="b" x="250" y="308" text-anchor="middle">non legge</text>
  <rect class="c" x="115" y="390" width="270" height="110" rx="18"/><text class="b" x="250" y="432" text-anchor="middle">calcola il risultato</text><text class="b" x="250" y="468" text-anchor="middle">write(fd[1], dato)</text>
  <rect class="closed" x="115" y="545" width="270" height="65" rx="18"/><text class="b" x="250" y="586" text-anchor="middle">close(fd[1])</text>
  <rect class="pipe" x="515" y="285" width="370" height="180" rx="90"/><text class="h" x="700" y="350" text-anchor="middle">Pipe nel kernel</text><text class="b" x="700" y="395" text-anchor="middle">fd[1] → flusso di byte → fd[0]</text><text class="b" x="700" y="430" text-anchor="middle">unidirezionale</text>
  <path d="M385 445 C455 445 470 375 515 375" stroke="#7C3AED" stroke-width="6" fill="none" marker-end="url(#a)"/>
  <rect class="p" x="970" y="135" width="360" height="500" rx="26"/><text class="h" x="1150" y="185" text-anchor="middle">Processo padre</text>
  <rect class="closed" x="1015" y="240" width="270" height="90" rx="18"/><text class="b" x="1150" y="278" text-anchor="middle">close(fd[1])</text><text class="b" x="1150" y="308" text-anchor="middle">non scrive</text>
  <rect class="p" x="1015" y="390" width="270" height="110" rx="18"/><text class="b" x="1150" y="432" text-anchor="middle">read(fd[0], dato)</text><text class="b" x="1150" y="468" text-anchor="middle">riceve il risultato</text>
  <rect class="p" x="1015" y="545" width="270" height="65" rx="18"/><text class="b" x="1150" y="586" text-anchor="middle">waitpid(figlio)</text>
  <path d="M885 375 C930 375 945 445 1015 445" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#a)"/>
  <text class="b" x="700" y="690" text-anchor="middle">Chiudere le estremità inutilizzate permette di osservare correttamente EOF e riduce errori di protocollo.</text>
</svg>