<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Provenienza di una fonte didattica</title>
  <desc id="desc">Il contenuto pubblicato deriva da una fonte identificata e versionata, da un frammento localizzato, da una trasformazione dichiarata e da una revisione umana con stato di approvazione.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 22px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:18px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.src{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.frag{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}.tr{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.rev{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.out{fill:#FFFFFF;stroke:#0F172A;stroke-width:3}</style></defs>
  <rect width="1400" height="780" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Provenienza: sapere da dove arriva ogni contenuto</text>
  <rect class="src" x="55" y="165" width="240" height="300" rx="24"/><text class="h" x="175" y="210" text-anchor="middle">FONTE</text><text class="b" x="175" y="255" text-anchor="middle">autore / ente</text><text class="b" x="175" y="292" text-anchor="middle">titolo / repository</text><text class="b" x="175" y="329" text-anchor="middle">URI / provider</text><text class="b" x="175" y="366" text-anchor="middle">licenza</text><text class="b" x="175" y="403" text-anchor="middle">data acquisizione</text>
  <rect class="frag" x="345" y="165" width="240" height="300" rx="24"/><text class="h" x="465" y="210" text-anchor="middle">VERSIONE</text><text class="b" x="465" y="255" text-anchor="middle">commit / ref</text><text class="b" x="465" y="292" text-anchor="middle">path</text><text class="b" x="465" y="329" text-anchor="middle">anchor / pagina</text><text class="b" x="465" y="366" text-anchor="middle">digest</text><text class="b" x="465" y="403" text-anchor="middle">snapshot</text>
  <rect class="tr" x="635" y="165" width="240" height="300" rx="24"/><text class="h" x="755" y="210" text-anchor="middle">TRASFORMAZIONE</text><text class="b" x="755" y="255" text-anchor="middle">sintesi</text><text class="b" x="755" y="292" text-anchor="middle">collegamento</text><text class="b" x="755" y="329" text-anchor="middle">adattamento</text><text class="b" x="755" y="366" text-anchor="middle">esempio originale</text><text class="b" x="755" y="403" text-anchor="middle">strumenti usati</text>
  <rect class="rev" x="925" y="165" width="240" height="300" rx="24"/><text class="h" x="1045" y="210" text-anchor="middle">REVISIONE</text><text class="b" x="1045" y="255" text-anchor="middle">revisore</text><text class="b" x="1045" y="292" text-anchor="middle">controlli</text><text class="b" x="1045" y="329" text-anchor="middle">stato</text><text class="b" x="1045" y="366" text-anchor="middle">data</text><text class="b" x="1045" y="403" text-anchor="middle">note e limiti</text>
  <path d="M295 315 H345 M585 315 H635 M875 315 H925" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/>
  <rect class="out" x="1185" y="205" width="175" height="220" rx="24"/><text class="h" x="1272" y="255" text-anchor="middle">CONTENUTO</text><text class="h" x="1272" y="287" text-anchor="middle">PUBBLICATO</text><text class="b" x="1272" y="335" text-anchor="middle">identificabile</text><text class="b" x="1272" y="370" text-anchor="middle">aggiornabile</text><text class="b" x="1272" y="402" text-anchor="middle">rimovibile</text>
  <path d="M1165 315 H1185" stroke="#0F766E" stroke-width="5" marker-end="url(#a)"/>
  <rect class="out" x="235" y="565" width="930" height="115" rx="24"/><text class="h" x="700" y="610" text-anchor="middle">Record di provenienza</text><text class="b" x="700" y="650" text-anchor="middle">lega contenuto, fonte, versione, trasformazione, licenza e decisione umana</text>
  <path d="M175 465 C175 525 330 530 390 565 M465 465 V565 M755 465 V565 M1045 465 C1045 525 930 530 870 565" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#a)"/>
  <text class="b" x="700" y="735" text-anchor="middle">Senza provenienza non sappiamo verificare, aggiornare, attribuire o rimuovere in modo affidabile.</text>
</svg>