<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Bisogno, requisito, soluzione e vincolo</title>
  <desc id="desc">Mappa che distingue il problema dello stakeholder, la proprietà richiesta al sistema, la scelta progettuale e il limite che restringe le alternative, mostrando le relazioni tra i quattro concetti.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><style>.t{font:700 30px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.h{font:700 24px system-ui,Segoe UI,Arial,sans-serif;fill:#0F172A}.b{font:19px system-ui,Segoe UI,Arial,sans-serif;fill:#334155}.need{fill:#FFF7ED;stroke:#B45309;stroke-width:3}.req{fill:#EFF6FF;stroke:#2563EB;stroke-width:3}.sol{fill:#ECFDF5;stroke:#0F766E;stroke-width:3}.con{fill:#F5F3FF;stroke:#7C3AED;stroke-width:3}</style></defs>
  <rect width="1400" height="760" fill="#F8FAFC"/><text class="t" x="700" y="55" text-anchor="middle">Dalla necessità alla scelta progettuale</text>
  <rect class="need" x="80" y="170" width="300" height="210" rx="26"/><text class="h" x="230" y="220" text-anchor="middle">BISOGNO</text><text class="b" x="230" y="265" text-anchor="middle">problema o obiettivo</text><text class="b" x="230" y="300" text-anchor="middle">dello stakeholder</text><text class="b" x="230" y="345" text-anchor="middle">«riusare materiali»</text>
  <rect class="req" x="550" y="170" width="300" height="210" rx="26"/><text class="h" x="700" y="220" text-anchor="middle">REQUISITO</text><text class="b" x="700" y="265" text-anchor="middle">capacità o qualità</text><text class="b" x="700" y="300" text-anchor="middle">che il sistema deve offrire</text><text class="b" x="700" y="345" text-anchor="middle">«selezionare più fonti»</text>
  <rect class="sol" x="1020" y="170" width="300" height="210" rx="26"/><text class="h" x="1170" y="220" text-anchor="middle">SOLUZIONE</text><text class="b" x="1170" y="265" text-anchor="middle">scelta tecnica</text><text class="b" x="1170" y="300" text-anchor="middle">che soddisfa il requisito</text><text class="b" x="1170" y="345" text-anchor="middle">«catalogo sources[]»</text>
  <path d="M380 275 H550 M850 275 H1020" stroke="#2563EB" stroke-width="5" marker-end="url(#a)"/><text class="b" x="465" y="250" text-anchor="middle">si traduce in</text><text class="b" x="935" y="250" text-anchor="middle">guida</text>
  <rect class="con" x="455" y="505" width="490" height="155" rx="26"/><text class="h" x="700" y="550" text-anchor="middle">VINCOLO</text><text class="b" x="700" y="590" text-anchor="middle">limita le soluzioni ammesse</text><text class="b" x="700" y="625" text-anchor="middle">«MVP senza database esterno»</text>
  <path d="M700 505 V380" stroke="#7C3AED" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a)"/><path d="M820 505 C970 460 1100 430 1150 380" stroke="#7C3AED" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <text class="b" x="700" y="715" text-anchor="middle">Separare i concetti evita di imporre troppo presto una tecnologia che non risponde al bisogno reale.</text>
</svg>