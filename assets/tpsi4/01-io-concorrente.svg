<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Tre attività: la rete aspetta, l’interfaccia risponde</title>
  <desc id="scene-desc">L'attività A legge il sensore e pubblica misure in una coda per B e nell'ultimo valore per C. B invia i dati via socket al server. C legge l'ultimo valore e gestisce lo schermo. Se B aspetta la rete, A può proseguire finché la coda ha spazio e C può rispondere ai comandi.</desc>
