<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Debugging: dalle osservazioni alla correzione</title>
  <desc id="scene-desc">Riproduci e riduci il difetto, raccogli evidenze, formula un'ipotesi e mettila alla prova. Se è smentita, formula una nuova ipotesi; se confermata, correggi e aggiungi una regressione.</desc>
