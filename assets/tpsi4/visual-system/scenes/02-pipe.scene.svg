<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-pipe.svg">
<title id="scene-title">Una pipe: dal figlio al padre</title>
<desc id="scene-desc">Dopo pipe e fork, il figlio scrive il quadrato su fd[1] e chiude fd[0]; il padre legge fd[0] e chiude fd[1]. I dati attraversano la pipe del kernel; waitpid raccoglie il figlio.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Una pipe: dal figlio al padre</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Laboratorio del quadrato: una sola direzione per ciascuna pipe.</text><rect x="64" y="256" width="488" height="544" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Figlio · produttore</text><use href="#tpsi-process" x="218" y="332" width="180" height="140"/><text x="92" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Calcola il quadrato</text><text x="92" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">write(fd[1], …)</text><text x="92" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Chiude fd[0]</text><text x="92" y="628" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Poi chiude fd[1]</text><rect x="720" y="320" width="480" height="440" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="748" y="368" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Pipe nel kernel</text><use href="#tpsi-pipe" x="870" y="396" width="180" height="140"/><text x="748" y="572" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Flusso di byte</text><text x="748" y="612" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Nessun confine</text><text x="748" y="652" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">di messaggio implicito</text><rect x="1368" y="256" width="488" height="544" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1396" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Padre · consumatore</text><use href="#tpsi-process" x="1522" y="332" width="180" height="140"/><text x="1396" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Chiude fd[1]</text><text x="1396" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">read(fd[0], …)</text><text x="1396" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Chiude fd[0]</text><text x="1396" y="628" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">waitpid(figlio, …)</text><path d="M552 488H712" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="636" y="458" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">scrive</text><path d="M1200 488H1360" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1284" y="458" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">legge</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">EOF: la pipe è vuota e tutti i descrittori di scrittura sono chiusi.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Prima della fork il padre crea la pipe; dopo la fork entrambi ereditano le due estremità.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-pipe</text></g>
</svg>
