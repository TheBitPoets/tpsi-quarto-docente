<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-deadlock.svg">
<title id="scene-title">Deadlock: un ciclo di attese</title>
<desc id="scene-desc">Il thread A possiede X e attende Y; B possiede Y e attende X. Nel grafo la freccia risorsa verso thread indica assegnazione, thread verso risorsa indica attesa.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Deadlock: un ciclo di attese</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esempio con due mutex esclusivi, ciascuno con un solo proprietario.</text><rect x="208" y="224" width="496" height="208" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="236" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Thread A</text><text x="236" y="328" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Possiede X; attende Y</text><rect x="1216" y="224" width="496" height="208" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1244" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Mutex Y</text><text x="1244" y="328" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Assegnato a B</text><rect x="1216" y="640" width="496" height="208" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1244" y="688" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Thread B</text><text x="1244" y="744" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Possiede Y; attende X</text><rect x="208" y="640" width="496" height="208" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="236" y="688" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Mutex X</text><text x="236" y="744" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Assegnato ad A</text><path d="M704 328H1208" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="960" y="294" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">A attende Y</text><path d="M1464 432V632" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1620" y="544" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">Y assegnato a B</text><path d="M1216 744H712" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="960" y="710" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">B attende X</text><path d="M456 640V440" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="265" y="550" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">X assegnato ad A</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Prevenzione nell'esempio: tutti acquisiscono prima X e poi Y.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Un timeout può rilevare o limitare l'attesa; non dimostra l'assenza di deadlock.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-deadlock</text></g>
</svg>
