<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-lettori-scrittori.svg">
<title id="scene-title">Lettori e scrittori</title>
<desc id="scene-desc">Più lettori possono leggere insieme; uno scrittore richiede accesso esclusivo, senza lettori attivi. La politica di ammissione deve evitare attese indefinite.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Lettori e scrittori</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Due situazioni ammesse. Non sono fasi obbligatorie di un algoritmo.</text><rect x="64" y="224" width="856" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="96" y="278" fill="{{ink}}" font-size="36" font-weight="700" text-anchor="start">Letture simultanee</text><use href="#tpsi-thread" x="120" y="344" width="240" height="160"/><use href="#tpsi-thread" x="540" y="344" width="240" height="160"/><text x="240" y="534" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">Lettore A</text><text x="660" y="534" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">Lettore B</text><use href="#tpsi-memory" x="350" y="620" width="270" height="168"/><text x="492" y="826" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">Dati non modificati</text><rect x="976" y="224" width="880" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1008" y="278" fill="{{ink}}" font-size="36" font-weight="700" text-anchor="start">Scrittura esclusiva</text><use href="#tpsi-thread" x="1250" y="344" width="300" height="160"/><text x="1400" y="534" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">Un solo scrittore</text><use href="#tpsi-memory" x="1260" y="620" width="270" height="168"/><text x="1416" y="826" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">Nessun lettore attivo</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Con priorità assoluta ai lettori, uno scrittore può restare in attesa indefinita.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Dichiarare una politica di ammissione: usare un lock non basta a definirla.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-lettori-scrittori</text></g>
</svg>
