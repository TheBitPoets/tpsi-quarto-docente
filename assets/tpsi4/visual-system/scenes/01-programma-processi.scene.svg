<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-programma-processi.svg">
<title id="scene-title">Un programma, due processi</title>
<desc id="scene-desc">Lo stesso eseguibile avvia due processi con PID diversi e spazi di memoria distinti.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Un programma, due processi</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il file descrive le istruzioni; ogni esecuzione ha una propria identità.</text><rect x="64" y="280" width="440" height="490" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="328" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Programma</text><use href="#tpsi-document" x="194" y="356" width="180" height="140"/><text x="92" y="532" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">File eseguibile</text><text x="92" y="572" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Istruzioni su disco</text><rect x="736" y="208" width="1120" height="300" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="764" y="256" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Processo A · PID 410</text><text x="764" y="312" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esecuzione attiva · memoria e stato propri</text><use href="#tpsi-process" x="1530" y="285" width="220" height="170"/><rect x="736" y="556" width="1120" height="300" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="764" y="604" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Processo B · PID 411</text><text x="764" y="660" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stesso codice · altra esecuzione</text><use href="#tpsi-process" x="1530" y="630" width="220" height="170"/><path d="M504 464H620V358H728" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="618" y="320" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">avvio A</text><path d="M620 464V706H728" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="618" y="670" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">avvio B</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il nome del programma può coincidere. Il PID distingue le esecuzioni.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 01-programma-processi</text></g>
</svg>
