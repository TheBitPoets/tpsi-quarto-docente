<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-race.svg">
<title id="scene-title">Due incrementi, un aggiornamento perso</title>
<desc id="scene-desc">Nel modello didattico A e B leggono entrambi zero, calcolano uno e scrivono uno. L'aggiornamento di un thread viene perso.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Due incrementi, un aggiornamento perso</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Scomponi l'operazione: leggere, calcolare e scrivere sono passi distinti.</text><rect x="64" y="208" width="1192" height="648" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="104" y="264" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Un interleaving possibile · x iniziale = 0</text><rect x="88" y="298" width="1144" height="64" rx="8" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="112" y="340" fill="{{ink}}" font-size="{{label}}" font-weight="700" text-anchor="start">Passo</text><text x="296" y="340" fill="{{ink}}" font-size="{{label}}" font-weight="700" text-anchor="start">Thread A</text><text x="688" y="340" fill="{{ink}}" font-size="{{label}}" font-weight="700" text-anchor="start">Thread B</text><text x="1160" y="340" fill="{{ink}}" font-size="{{label}}" font-weight="700" text-anchor="middle">x</text><rect x="88" y="370" width="1144" height="64" rx="8" fill="#e8f1f8" stroke="none" stroke-width="3"/><text x="112" y="412" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">1</text><text x="296" y="412" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">legge 0</text><text x="688" y="412" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">—</text><text x="1160" y="412" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">0</text><rect x="88" y="442" width="1144" height="64" rx="8" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="112" y="484" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">2</text><text x="296" y="484" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">—</text><text x="688" y="484" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">legge 0</text><text x="1160" y="484" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">0</text><rect x="88" y="514" width="1144" height="64" rx="8" fill="#e8f1f8" stroke="none" stroke-width="3"/><text x="112" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">3</text><text x="296" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">calcola 1</text><text x="688" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">—</text><text x="1160" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">0</text><rect x="88" y="586" width="1144" height="64" rx="8" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="112" y="628" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">4</text><text x="296" y="628" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">—</text><text x="688" y="628" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">calcola 1</text><text x="1160" y="628" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">0</text><rect x="88" y="658" width="1144" height="64" rx="8" fill="#e8f1f8" stroke="none" stroke-width="3"/><text x="112" y="700" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">5</text><text x="296" y="700" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">scrive 1</text><text x="688" y="700" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">—</text><text x="1160" y="700" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">1</text><rect x="88" y="730" width="1144" height="64" rx="8" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="112" y="772" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">6</text><text x="296" y="772" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">—</text><text x="688" y="772" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">scrive 1</text><text x="1160" y="772" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">1</text><rect x="1320" y="208" width="536" height="648" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1348" y="256" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Risultato del modello</text><use href="#tpsi-memory" x="1498" y="284" width="180" height="140"/><text x="1348" y="460" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Due incrementi richiesti</text><text x="1348" y="500" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Valore finale mostrato: 1</text><text x="1348" y="540" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Valore desiderato: 2</text><text x="1348" y="580" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Manca l'accesso esclusivo</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">È una traccia concettuale, non una previsione dell'esito di un programma C.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Una data race su oggetti C non atomici comporta comportamento indefinito.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-race</text></g>
