<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../06-accessi.svg">
<title id="scene-title">L'autorizzazione si applica sul server</title>
<desc id="scene-desc">La richiesta porta un'identità al server. Il server verifica ruolo, operazione e risorsa: può consentire la lettura della propria consegna oppure rifiutare l'accesso dello studente alla soluzione docente.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">L'autorizzazione si applica sul server</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Mostrare o nascondere un pulsante non protegge una risorsa.</text><rect x="64" y="280" width="432" height="496" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="328" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Richiesta</text><use href="#tpsi-user" x="190" y="356" width="180" height="140"/><text x="92" y="532" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Identità autenticata</text><text x="92" y="572" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Operazione richiesta</text><text x="92" y="612" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Risorsa interessata</text><rect x="696" y="280" width="536" height="496" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="724" y="328" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Controllo sul server</text><use href="#tpsi-shield" x="874" y="356" width="180" height="140"/><text x="724" y="532" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ruolo e autorizzazioni</text><text x="724" y="572" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Proprietà della risorsa</text><text x="724" y="612" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Regola applicata a ogni accesso</text><rect x="1432" y="224" width="424" height="272" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1460" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Consenti</text><text x="1460" y="328" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Studente: propria</text><text x="1460" y="368" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">consegna</text><rect x="1432" y="576" width="424" height="272" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1460" y="624" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Rifiuta</text><text x="1460" y="680" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Studente: soluzione</text><text x="1460" y="720" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">riservata al docente</text><path d="M496 508H688" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="596" y="474" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">richiesta</text><path d="M1232 508H1328V360H1424" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1318" y="316" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">ammessa</text><path d="M1328 508V712H1424" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1320" y="762" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">negata</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Autenticazione: chi sei? Autorizzazione: puoi eseguire questa operazione?</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 06-accessi</text></g>
