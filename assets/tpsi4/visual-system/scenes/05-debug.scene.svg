<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../05-debug.svg">
<title id="scene-title">Debugging: dalle osservazioni alla correzione</title>
<desc id="scene-desc">Riproduci e riduci il difetto, raccogli evidenze, formula un'ipotesi e mettila alla prova. Se è smentita, formula una nuova ipotesi; se confermata, correggi e aggiungi una regressione.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Debugging: dalle osservazioni alla correzione</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ogni passaggio deve produrre un'informazione controllabile.</text><rect x="64" y="256" width="400" height="472" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">1 · Riproduci</text><use href="#tpsi-terminal" x="174" y="332" width="180" height="140"/><text x="92" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Input minimo</text><text x="92" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ambiente e versione</text><text x="92" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Difetto osservabile</text><rect x="528" y="256" width="400" height="472" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="556" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">2 · Osserva</text><use href="#tpsi-debugger" x="638" y="332" width="180" height="140"/><text x="556" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Log e debugger</text><text x="556" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stato e stack</text><text x="556" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ipotesi esplicita</text><rect x="992" y="256" width="400" height="472" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1020" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">3 · Metti alla prova</text><use href="#tpsi-test" x="1102" y="332" width="180" height="140"/><text x="1020" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esperimento mirato</text><text x="1020" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Conferma o smentita</text><text x="1020" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Confronto degli esiti</text><rect x="1456" y="256" width="400" height="472" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1484" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">4 · Correggi</text><use href="#tpsi-repository" x="1566" y="332" width="180" height="140"/><text x="1484" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Modifica motivata</text><text x="1484" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Test di regressione</text><text x="1484" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Controlli più ampi</text><path d="M464 480H520" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M928 480H984" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1392 480H1448" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1192 728V840H728V736" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="958" y="822" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">ipotesi smentita: rivedi</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il logging e il debugger possono modificare il timing di un programma concorrente.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 05-debug</text></g>
</svg>
