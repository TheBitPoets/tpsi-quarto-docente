<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../06-progetto.svg">
<title id="scene-title">Progetto finale: un sistema concorrente verificabile</title>
<desc id="scene-desc">Un coordinatore distribuisce richieste attraverso una coda limitata a più worker. Ogni richiesta ha un'identità e un esito tracciabile; requisiti, test e documentazione accompagnano il sistema.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Progetto finale: un sistema concorrente verificabile</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Coordinatore, coda limitata e worker; arresto cooperativo e consegna documentata.</text><rect x="64" y="256" width="432" height="536" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Coordinatore</text><use href="#tpsi-process" x="190" y="332" width="180" height="140"/><text x="92" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Accetta richieste</text><text x="92" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Assegna un ID</text><text x="92" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Gestisce l'arresto</text><rect x="688" y="256" width="472" height="536" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="716" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Coda limitata</text><use href="#tpsi-queue" x="834" y="332" width="180" height="140"/><text x="716" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Capacità e invariante</text><text x="716" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Protocollo di accesso</text><text x="716" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Attesa senza busy loop</text><rect x="1376" y="224" width="480" height="248" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1404" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Worker A</text><text x="1404" y="328" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Elabora e registra l'esito</text><rect x="1376" y="544" width="480" height="248" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1404" y="592" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Worker B</text><text x="1404" y="648" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Elabora e registra l'esito</text><path d="M496 500H680" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="592" y="466" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">inserisce</text><path d="M1160 500H1264V350H1368" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1250" y="298" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">preleva</text><path d="M1264 500V668H1368" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1250" y="722" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">preleva</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">La consegna comprende requisiti, codice, test, report, README e fonti.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Decidere la politica di arresto: completare le richieste accettate o annullarle esplicitamente.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 06-progetto</text></g>
</svg>
