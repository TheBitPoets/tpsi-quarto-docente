<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-monitor.svg">
<title id="scene-title">Il monitor incapsula le regole</title>
<desc id="scene-desc">I chiamanti accedono allo stato del monitor attraverso operazioni protette. Il monitor contiene stato privato, mutua esclusione e condizioni di attesa.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Il monitor incapsula le regole</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Monitor software: stato, operazioni e sincronizzazione nello stesso confine.</text><rect x="64" y="280" width="416" height="440" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="328" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Chiamanti</text><use href="#tpsi-thread" x="182" y="356" width="180" height="140"/><text x="92" y="532" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Invocano operazioni</text><text x="92" y="572" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Non modificano</text><text x="92" y="612" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">lo stato direttamente</text><rect x="752" y="224" width="1104" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="792" y="280" fill="{{ink}}" font-size="36" font-weight="700" text-anchor="start">Confine del monitor</text><use href="#tpsi-monitor" x="800" y="332" width="240" height="180"/><rect x="1136" y="328" width="648" height="180" rx="24" fill="#eef2ff" stroke="{{data}}" stroke-width="3"/><text x="1172" y="382" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="start">Stato privato</text><text x="1172" y="424" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="start">buffer · count · invariante</text><rect x="800" y="576" width="984" height="212" rx="24" fill="#ccfbf1" stroke="{{thread}}" stroke-width="3"/><text x="840" y="628" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="start">Operazioni: put / take</text><text x="840" y="670" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="start">Mutua esclusione e condizioni di attesa</text><text x="840" y="712" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="start">Al ritorno da wait: ricontrollo del predicato</text><path d="M480 498H744" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="616" y="466" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">put / take</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il monitor è un'astrazione software, non un dispositivo di visualizzazione.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-monitor</text></g>
</svg>
