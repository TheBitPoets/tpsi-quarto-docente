<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../05-statica-dinamica.svg">
<title id="scene-title">Verifica statica e dinamica</title>
<desc id="scene-desc">La verifica statica esamina codice e documenti senza eseguire il programma: review, analisi e warning. La verifica dinamica esegue il programma con input e confronta risultati e comportamento attesi.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Verifica statica e dinamica</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Due fonti di evidenza complementari.</text><rect x="64" y="224" width="856" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Statica · senza esecuzione</text><use href="#tpsi-document" x="402" y="300" width="180" height="140"/><text x="92" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esamina codice, schemi e documenti</text><text x="92" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Review · analisi · warning</text><text x="92" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Individua problemi prima della prova</text><text x="92" y="596" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Non osserva l'esecuzione reale</text><rect x="976" y="224" width="880" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1004" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Dinamica · durante l'esecuzione</text><use href="#tpsi-test" x="1326" y="300" width="180" height="140"/><text x="1004" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Input e ambiente definiti</text><text x="1004" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Programma → output osservato</text><text x="1004" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Confronto con il risultato atteso</text><text x="1004" y="596" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Sanitizer: controlli sui percorsi eseguiti</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Un test passato copre ciò che è stato effettivamente verificato.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Verifica: rispettiamo la specifica? Validazione: soddisfiamo il bisogno dell'utente?</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 05-statica-dinamica</text></g>
</svg>
