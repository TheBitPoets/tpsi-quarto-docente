<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-stati-processo.svg">
<title id="scene-title">Il ciclo di vita di un processo</title>
<desc id="scene-desc">Nuovo passa a pronto; lo scheduler porta pronto in esecuzione. Attesa di I/O porta in attesa; l'evento riporta a pronto. La preemption riporta il processo da in esecuzione a pronto; l'uscita porta a terminato.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Il ciclo di vita di un processo</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Modello didattico: il risveglio rende pronto il processo, poi lo scheduler sceglie.</text><rect x="64" y="320" width="300" height="160" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="368" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Nuovo</text><rect x="528" y="320" width="320" height="160" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="556" y="368" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Pronto</text><rect x="1056" y="320" width="360" height="160" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1084" y="368" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">In esecuzione</text><rect x="1584" y="320" width="272" height="160" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1612" y="368" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Terminato</text><rect x="864" y="672" width="360" height="160" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="892" y="720" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">In attesa</text><path d="M364 400H520" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="442" y="372" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">ammissione</text><path d="M848 400H1048" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="950" y="372" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">dispatch</text><path d="M1416 400H1576" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1500" y="372" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">uscita</text><path d="M1236 320V232H688V312" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="968" y="214" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">preemption / fine quanto</text><path d="M1236 480V600H1104V664" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1340" y="570" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">attesa I/O</text><path d="M864 750H688V488" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="510" y="646" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">evento completato</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Pronto ≠ in esecuzione. L'evento non assegna direttamente la CPU.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Gli stati reali del sistema operativo possono essere più articolati.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 01-stati-processo</text></g>
</svg>
