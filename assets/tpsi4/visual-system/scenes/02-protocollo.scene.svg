<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-protocollo.svg">
<title id="scene-title">Un flusso di byte ha bisogno di un protocollo</title>
<desc id="scene-desc">Un messaggio comprende versione, tipo, ID richiesta, lunghezza e payload. Il ricevente accumula i byte e valida il formato prima di elaborare la richiesta.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Un flusso di byte ha bisogno di un protocollo</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">I campi danno significato ai dati; il trasporto non definisce da solo i messaggi.</text><rect x="64" y="232" width="480" height="248" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="280" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Mittente</text><text x="92" y="336" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Codifica i campi</text><text x="92" y="376" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Invia i byte</text><rect x="1376" y="232" width="480" height="248" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1404" y="280" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Ricevente</text><text x="1404" y="336" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ricostruisce il messaggio</text><text x="1404" y="376" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Valida prima di elaborare</text><use href="#tpsi-message" x="820" y="232" width="260" height="180"/><path d="M544 364H800" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="672" y="334" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">byte</text><path d="M1100 364H1368" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1234" y="334" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">byte</text><rect x="64" y="576" width="344" height="160" rx="24" fill="#ccfbf1" stroke="none" stroke-width="3"/><text x="236" y="644" fill="{{ink}}" font-size="30" font-weight="700" text-anchor="middle">versione</text><text x="236" y="696" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="middle">header</text><rect x="424" y="576" width="344" height="160" rx="24" fill="#ccfbf1" stroke="none" stroke-width="3"/><text x="596" y="644" fill="{{ink}}" font-size="30" font-weight="700" text-anchor="middle">tipo</text><text x="596" y="696" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="middle">header</text><rect x="784" y="576" width="344" height="160" rx="24" fill="#ccfbf1" stroke="none" stroke-width="3"/><text x="956" y="644" fill="{{ink}}" font-size="30" font-weight="700" text-anchor="middle">ID richiesta</text><text x="956" y="696" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="middle">header</text><rect x="1144" y="576" width="344" height="160" rx="24" fill="#ccfbf1" stroke="none" stroke-width="3"/><text x="1316" y="644" fill="{{ink}}" font-size="30" font-weight="700" text-anchor="middle">lunghezza</text><text x="1316" y="696" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="middle">header</text><rect x="1504" y="576" width="344" height="160" rx="24" fill="#eef2ff" stroke="none" stroke-width="3"/><text x="1676" y="644" fill="{{ink}}" font-size="30" font-weight="700" text-anchor="middle">payload</text><text x="1676" y="696" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="middle">dati</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Una read può restituire solo parte dei byte necessari: accumulare e controllare.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Definire limiti, errori, chiusura e correlazione richiesta/risposta.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-protocollo</text></g>
</svg>
