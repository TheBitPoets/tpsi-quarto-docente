<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-memoria-thread.svg">
<title id="scene-title">Processi isolati, thread nello stesso spazio</title>
<desc id="scene-desc">Due processi hanno heap separati. Due thread di uno stesso processo condividono heap, globali e descrittori, ma conservano stack e registri propri.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Processi isolati, thread nello stesso spazio</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il confine grande è lo spazio di indirizzamento; gli stack dei thread restano separati.</text><rect x="64" y="208" width="840" height="656" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="100" y="258" fill="{{ink}}" font-size="36" font-weight="700" text-anchor="start">Due processi</text><rect x="96" y="302" width="368" height="490" rx="24" fill="#dbeafe" stroke="{{process}}" stroke-width="3"/><rect x="496" y="302" width="368" height="490" rx="24" fill="#dbeafe" stroke="{{process}}" stroke-width="3"/><text x="124" y="350" fill="{{ink}}" font-size="{{section}}" font-weight="400" text-anchor="start">Processo A</text><text x="524" y="350" fill="{{ink}}" font-size="{{section}}" font-weight="400" text-anchor="start">Processo B</text><use href="#tpsi-memory" x="150" y="388" width="260" height="190"/><use href="#tpsi-memory" x="550" y="388" width="260" height="190"/><text x="128" y="640" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Heap A</text><text x="128" y="680" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stack A</text><text x="128" y="720" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Registri A</text><text x="528" y="640" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Heap B</text><text x="528" y="680" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stack B</text><text x="528" y="720" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Registri B</text><rect x="960" y="208" width="896" height="656" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="996" y="258" fill="{{ink}}" font-size="36" font-weight="700" text-anchor="start">Un processo, due thread</text><rect x="996" y="302" width="824" height="164" rx="24" fill="#eef2ff" stroke="{{data}}" stroke-width="3"/><text x="1032" y="355" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Codice · globali · heap · descrittori</text><text x="1032" y="395" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stato condiviso nel processo</text><rect x="996" y="506" width="392" height="286" rx="24" fill="#ccfbf1" stroke="{{thread}}" stroke-width="3"/><rect x="1428" y="506" width="392" height="286" rx="24" fill="#ccfbf1" stroke="{{thread}}" stroke-width="3"/><use href="#tpsi-thread" x="1060" y="550" width="240" height="110"/><use href="#tpsi-thread" x="1500" y="550" width="240" height="110"/><text x="1024" y="702" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="start">Thread A: stack proprio</text><text x="1024" y="740" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="start">Registri propri</text><text x="1456" y="702" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="start">Thread B: stack proprio</text><text x="1456" y="740" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="start">Registri propri</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Dopo fork, le normali scritture in memoria non si propagano fra padre e figlio.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Memoria condivisa fra processi: possibile, ma deve essere predisposta esplicitamente.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 01-memoria-thread</text></g>
</svg>
