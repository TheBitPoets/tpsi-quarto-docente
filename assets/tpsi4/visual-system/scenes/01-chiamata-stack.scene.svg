<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-chiamata-stack.svg"><title id="scene-title">main chiama somma: spazio per a, b, c e ritorno</title><desc id="scene-desc">Tre viste dello stesso stack. Prima della chiamata RSP vale 0x1000. Durante somma, a vale 2 a 0x0FF4, b vale 3 a 0x0FF0 e c vale 5 a 0x0FEC; RSP punta a c. L'indirizzo di ritorno 0x401025 occupa 8 byte da 0x0FF8. Dopo il ritorno RSP torna a 0x1000 e main riceve 5.</desc><defs id="visual-kit-components"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="{{line}}"/></marker></defs><g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="24" fill="{{canvas}}"/>
<text x="64" y="85" font-size="48" fill="{{surface}}" font-weight="700">main chiama somma: spazio per a, b, c e ritorno</text>
<text x="64" y="143" font-size="28" fill="{{muted}}" font-weight="400">Linux x86-64 · int: 4 byte · indirizzo di ritorno: 8 byte · disposizione didattica</text>
<rect x="64" y="210" width="552" height="666" rx="24" fill="{{surface}}"/>
<text x="88" y="263" font-size="30" fill="{{ink}}" font-weight="700">1. main sta per chiamare</text>
<text x="88" y="310" font-size="26" fill="{{ink}}" font-weight="400">RSP = 0x1000</text>
<text x="88" y="352" font-size="26" fill="{{ink}}" font-weight="400">Non sono ancora presenti a, b, c.</text>
<text x="84" y="417" font-size="24" fill="{{ink}}" font-weight="700">0x0FEC</text>
<rect x="244" y="390" width="348" height="54" rx="24" fill="#e2e8f0"/>
<text x="262" y="425" font-size="26" fill="{{ink}}" font-weight="400">Non ancora usato</text>
<text x="84" y="481" font-size="24" fill="{{ink}}" font-weight="700">0x0FF0</text>
<rect x="244" y="454" width="348" height="54" rx="24" fill="#e2e8f0"/>
<text x="262" y="489" font-size="26" fill="{{ink}}" font-weight="400">Non ancora usato</text>
<text x="84" y="545" font-size="24" fill="{{ink}}" font-weight="700">0x0FF4</text>
<rect x="244" y="518" width="348" height="54" rx="24" fill="#e2e8f0"/>
<text x="262" y="553" font-size="26" fill="{{ink}}" font-weight="400">Non ancora usato</text>
<text x="84" y="609" font-size="24" fill="{{ink}}" font-weight="700">0x0FF8</text>
<rect x="244" y="582" width="348" height="116" rx="24" fill="#e2e8f0"/>
<text x="262" y="616" font-size="23" fill="{{ink}}" font-weight="400">Non ancora usato</text>
<text x="262" y="650" font-size="23" fill="{{ink}}" font-weight="400">Spazio per il ritorno</text>
<text x="84" y="737" font-size="24" fill="{{ink}}" font-weight="700">0x1000</text>
<rect x="244" y="710" width="348" height="78" rx="24" fill="#dbeafe"/>
<text x="262" y="757" font-size="28" fill="{{ink}}" font-weight="700">Stack di main</text>
<text x="84" y="763" font-size="24" fill="{{ink}}" font-weight="700">RSP</text>
<path d="M146 755 H234" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="684" y="210" width="552" height="666" rx="24" fill="{{surface}}"/>
<text x="708" y="263" font-size="30" fill="{{ink}}" font-weight="700">2. somma ha calcolato c</text>
<text x="708" y="310" font-size="26" fill="{{ink}}" font-weight="400">RSP = 0x0FEC</text>
<text x="708" y="352" font-size="26" fill="{{ink}}" font-weight="400">a = 2, b = 3, c = 5</text>
<text x="704" y="417" font-size="24" fill="{{ink}}" font-weight="700">0x0FEC</text>
<rect x="864" y="390" width="348" height="54" rx="24" fill="#ccfbf1"/>
<text x="882" y="425" font-size="26" fill="{{ink}}" font-weight="400">c = 5     · 4 byte</text>
<text x="704" y="481" font-size="24" fill="{{ink}}" font-weight="700">0x0FF0</text>
<rect x="864" y="454" width="348" height="54" rx="24" fill="#ccfbf1"/>
<text x="882" y="489" font-size="26" fill="{{ink}}" font-weight="400">b = 3     · 4 byte</text>
<text x="704" y="545" font-size="24" fill="{{ink}}" font-weight="700">0x0FF4</text>
<rect x="864" y="518" width="348" height="54" rx="24" fill="#ccfbf1"/>
<text x="882" y="553" font-size="26" fill="{{ink}}" font-weight="400">a = 2     · 4 byte</text>
<text x="704" y="609" font-size="24" fill="{{ink}}" font-weight="700">0x0FF8</text>
<rect x="864" y="582" width="348" height="116" rx="24" fill="#fef3c7"/>
<text x="882" y="616" font-size="23" fill="{{ink}}" font-weight="400">Ritorno: 0x401025</text>
<text x="882" y="650" font-size="23" fill="{{ink}}" font-weight="400">Punto in cui main riprende</text>
<text x="882" y="684" font-size="23" fill="{{ink}}" font-weight="400">8 byte</text>
<text x="704" y="737" font-size="24" fill="{{ink}}" font-weight="700">0x1000</text>
<rect x="864" y="710" width="348" height="78" rx="24" fill="#dbeafe"/>
<text x="882" y="757" font-size="28" fill="{{ink}}" font-weight="700">Stack di main</text>
<text x="704" y="443" font-size="24" fill="{{ink}}" font-weight="700">RSP</text>
<path d="M766 435 H854" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1304" y="210" width="552" height="666" rx="24" fill="{{surface}}"/>
<text x="1328" y="263" font-size="30" fill="{{ink}}" font-weight="700">3. main riceve il risultato</text>
<text x="1328" y="310" font-size="26" fill="{{ink}}" font-weight="400">RSP = 0x1000</text>
<text x="1328" y="352" font-size="26" fill="{{ink}}" font-weight="400">Valore restituito: 5</text>
<text x="1324" y="417" font-size="24" fill="{{ink}}" font-weight="700">0x0FEC</text>
<rect x="1484" y="390" width="348" height="54" rx="24" fill="#e2e8f0"/>
<text x="1502" y="425" font-size="26" fill="{{ink}}" font-weight="400">Non più attivo</text>
<text x="1324" y="481" font-size="24" fill="{{ink}}" font-weight="700">0x0FF0</text>
<rect x="1484" y="454" width="348" height="54" rx="24" fill="#e2e8f0"/>
<text x="1502" y="489" font-size="26" fill="{{ink}}" font-weight="400">Non più attivo</text>
<text x="1324" y="545" font-size="24" fill="{{ink}}" font-weight="700">0x0FF4</text>
<rect x="1484" y="518" width="348" height="54" rx="24" fill="#e2e8f0"/>
<text x="1502" y="553" font-size="26" fill="{{ink}}" font-weight="400">Non più attivo</text>
<text x="1324" y="609" font-size="24" fill="{{ink}}" font-weight="700">0x0FF8</text>
<rect x="1484" y="582" width="348" height="116" rx="24" fill="#e2e8f0"/>
<text x="1502" y="616" font-size="23" fill="{{ink}}" font-weight="400">Non più attivo</text>
<text x="1502" y="650" font-size="23" fill="{{ink}}" font-weight="400">Ritorno già recuperato</text>
<text x="1324" y="737" font-size="24" fill="{{ink}}" font-weight="700">0x1000</text>
<rect x="1484" y="710" width="348" height="78" rx="24" fill="#dbeafe"/>
<text x="1502" y="757" font-size="28" fill="{{ink}}" font-weight="700">Stack di main</text>
<text x="1324" y="763" font-size="24" fill="{{ink}}" font-weight="700">RSP</text>
<path d="M1386 755 H1474" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<text x="88" y="830" font-size="26" fill="{{ink}}" font-weight="400">Indirizzi minori verso l’alto ↑</text>
<text x="708" y="830" font-size="25" fill="{{ink}}" font-weight="400">8 byte di ritorno + 12 byte locali</text>
<text x="1328" y="830" font-size="25" fill="{{ink}}" font-weight="400">Le celle liberate sono riutilizzabili</text>
<path d="M620 631 H676" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1240 631 H1296" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="64" y="920" width="1792" height="94" rx="24" fill="{{panel}}"/>
<text x="94" y="977" font-size="28" fill="{{surface}}" font-weight="400">Lo stack cresce verso indirizzi minori: RSP diminuisce. Al ritorno lo spazio si libera e RSP aumenta.</text>
<text x="64" y="1054" font-size="24" fill="{{muted}}" font-weight="400">TPSI 4 · Intel x86-64 · Modello didattico semplificato</text></g></svg>
