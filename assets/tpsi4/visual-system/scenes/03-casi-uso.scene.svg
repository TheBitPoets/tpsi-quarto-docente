<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../03-casi-uso.svg">
<title id="scene-title">Attori, obiettivi e confine del sistema</title>
<desc id="scene-desc">Il docente è associato all'assegnazione del laboratorio; lo studente alla consegna e alla consultazione del feedback. I casi d'uso sono dentro il confine della piattaforma; gli attori sono esterni.</desc>
<defs id="visual-kit-components"/>
