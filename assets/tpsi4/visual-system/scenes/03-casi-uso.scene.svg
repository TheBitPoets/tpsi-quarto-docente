<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Attori, obiettivi e confine del sistema</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Diagramma di casi d'uso essenziale: le associazioni non indicano l'ordine dei passi.</text><rect x="576" y="216" width="816" height="648" rx="24" fill="{{surface}}" stroke="#94a3b8" stroke-width="3"/><text x="616" y="272" fill="{{ink}}" font-size="34" font-weight="700" text-anchor="start">Confine: piattaforma didattica</text><ellipse cx="984" cy="384" rx="312" ry="58" fill="#dbeafe" stroke="{{process}}" stroke-width="3"/><text x="984" y="394" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="middle">Assegnare un laboratorio</text><ellipse cx="984" cy="552" rx="312" ry="58" fill="#dbeafe" stroke="{{process}}" stroke-width="3"/><text x="984" y="562" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="middle">Consegnare il lavoro</text><ellipse cx="984" cy="720" rx="312" ry="58" fill="#dbeafe" stroke="{{process}}" stroke-width="3"/><text x="984" y="730" fill="{{ink}}" font-size="30" font-weight="400" text-anchor="middle">Consultare il feedback</text><use href="#tpsi-user" x="144" y="336" width="180" height="200"/><text x="234" y="582" fill="{{surface}}" font-size="30" font-weight="400" text-anchor="middle">Docente</text><use href="#tpsi-user" x="1576" y="432" width="180" height="200"/><text x="1666" y="682" fill="{{surface}}" font-size="30" font-weight="400" text-anchor="middle">Studente</text><path d="M324 400L672 384M1576 500L1296 552M1576 574L1296 720" stroke="#7dd3fc" stroke-width="5" fill="none"/><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ogni ovale è un obiettivo. Uno scenario descrive un percorso concreto del caso d'uso.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Il diagramma va accompagnato da precondizioni, flusso principale e alternative.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 03-casi-uso</text></g>
