<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../04-documentazione.svg">
<title id="scene-title">La documentazione accompagna il progetto</title>
<desc id="scene-desc">Il README collega guida di avvio, documentazione architetturale e contratti del codice. I documenti rispondono a domande diverse e vengono mantenuti insieme al progetto.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">La documentazione accompagna il progetto</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il README orienta verso le informazioni autorevoli.</text><rect x="64" y="256" width="424" height="552" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">README</text><use href="#tpsi-document" x="186" y="332" width="180" height="140"/><text x="92" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Scopo e stato</text><text x="92" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Ingresso nel progetto</text><text x="92" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Link ai documenti</text><rect x="664" y="208" width="1192" height="184" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="692" y="256" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Guida di avvio</text><text x="692" y="312" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Come compilo, eseguo e verifico?</text><rect x="664" y="432" width="1192" height="184" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="692" y="480" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Architettura e ADR</text><text x="692" y="536" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Quali responsabilità? Perché questa scelta?</text><rect x="664" y="656" width="1192" height="184" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="692" y="704" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Contratti del codice</text><text x="692" y="760" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Input, output, errori, ownership e thread safety</text><path d="M488 524H572V300H656" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M572 524H656" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M572 524V748H656" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Un'informazione ha una fonte autorevole; gli altri documenti la collegano.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Versionare e verificare la documentazione insieme alle modifiche del codice.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 04-documentazione</text></g>
</svg>
