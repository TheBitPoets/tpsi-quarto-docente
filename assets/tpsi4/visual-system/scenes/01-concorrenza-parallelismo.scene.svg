<title id="scene-title">Concorrenza e parallelismo</title>
<desc id="scene-desc">Sequenziale: A termina prima di B. Concorrente su un core: A e B alternano i passi. Parallelo su due core: A e B eseguono passi nello stesso intervallo.</desc>
