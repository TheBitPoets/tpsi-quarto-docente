<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-fork-exec-wait.svg">
<title id="scene-title">fork, exec e wait: tre operazioni diverse</title>
<desc id="scene-desc">fork crea un figlio con un PID nuovo; exec cambia il programma del figlio mantenendone il PID; waitpid nel padre raccoglie lo stato dopo la terminazione del figlio.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">fork, exec e wait: tre operazioni diverse</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esempio di esecuzione riuscita: il tempo scorre dall'alto verso il basso.</text><rect x="64" y="208" width="560" height="180" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="256" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Padre · PID 410</text><text x="92" y="312" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">fork() restituisce 411</text><rect x="1120" y="208" width="736" height="180" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1148" y="256" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Figlio · PID 411</text><text x="1148" y="312" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">fork() restituisce 0</text><path d="M624 286H1112" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="872" y="260" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">fork: crea</text><rect x="1120" y="464" width="736" height="168" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1148" y="512" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Stesso figlio · PID 411</text><text x="1148" y="568" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">exec(): nuovo programma</text><path d="M1490 388V456" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1690" y="434" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">sostituisce il programma</text><rect x="64" y="464" width="560" height="168" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="512" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Padre · waitpid(411)</text><text x="92" y="568" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Attende, se il figlio è attivo</text><path d="M344 388V456" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1120" y="716" width="736" height="152" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1148" y="764" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Figlio terminato</text><text x="1148" y="820" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stato di uscita disponibile</text><path d="M1490 632V708" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="716" width="560" height="152" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="764" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Padre prosegue</text><text x="92" y="820" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stato raccolto</text><path d="M1120 790H632" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="872" y="760" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">waitpid ritorna</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">exec non crea un altro processo. waitpid può raccogliere un figlio già terminato.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Se fork fallisce restituisce −1 e non crea il figlio; se exec riesce non ritorna.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 01-fork-exec-wait</text></g>
</svg>
