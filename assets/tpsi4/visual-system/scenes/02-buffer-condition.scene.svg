<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-buffer-condition.svg">
<title id="scene-title">Produttori e consumatori</title>
<desc id="scene-desc">Il produttore attende not_full quando il buffer è pieno; il consumatore attende not_empty quando è vuoto. Inserimento e prelievo avvengono sotto mutex; ogni risveglio richiede un nuovo controllo del predicato.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Produttori e consumatori</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Un solo mutex protegge buffer, indici e contatore.</text><rect x="64" y="224" width="488" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Produttore</text><use href="#tpsi-thread" x="218" y="300" width="180" height="140"/><text x="92" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">lock</text><text x="92" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">while pieno: wait</text><text x="92" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">inserisci</text><text x="92" y="596" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">signal(not_empty)</text><text x="92" y="636" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">unlock</text><rect x="720" y="224" width="480" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="748" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Buffer limitato</text><use href="#tpsi-queue" x="870" y="300" width="180" height="140"/><text x="748" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">0 ≤ count ≤ N</text><text x="748" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">not_full: count &lt; N</text><text x="748" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">not_empty: count &gt; 0</text><rect x="1368" y="224" width="488" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1396" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Consumatore</text><use href="#tpsi-thread" x="1522" y="300" width="180" height="140"/><text x="1396" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">lock</text><text x="1396" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">while vuoto: wait</text><text x="1396" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">preleva</text><text x="1396" y="596" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">signal(not_full)</text><text x="1396" y="636" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">unlock</text><path d="M552 452H712" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="636" y="420" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">inserisce</text><path d="M1200 452H1360" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1284" y="420" fill="{{surface}}" font-size="26" font-weight="400" text-anchor="middle">preleva</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">wait rilascia atomicamente il mutex e lo riacquisisce prima di ritornare.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Il risveglio non garantisce il predicato: si ricontrolla con while.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-buffer-condition</text></g>
</svg>
