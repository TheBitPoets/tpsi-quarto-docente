<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-indirizzi-virtuali-mmu.svg"><title id="scene-title">Dalle pagine virtuali alle pagine fisiche</title><desc id="scene-desc">A sinistra lo spazio virtuale del processo è diviso in pagine. Al centro il kernel prepara una tabella: V1 corrisponde a F4, V2 a F1 e V3 a F6. La MMU usa queste corrispondenze per tradurre gli indirizzi. A destra la RAM contiene i frame fisici in un ordine diverso.</desc><defs id="visual-kit-components"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="{{line}}"/></marker></defs><g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="24" fill="{{canvas}}"/>
<text x="64" y="85" font-size="48" fill="{{surface}}" font-weight="700">Dalle pagine virtuali alle pagine fisiche</text>
<text x="64" y="143" font-size="28" fill="{{muted}}" font-weight="400">Il programma usa indirizzi virtuali · la RAM contiene le pagine fisiche</text>
<rect x="64" y="210" width="480" height="660" rx="24" fill="{{surface}}"/>
<text x="92" y="268" font-size="32" fill="{{ink}}" font-weight="700">SPAZIO VIRTUALE</text>
<text x="92" y="313" font-size="28" fill="{{ink}}" font-weight="400">Gli indirizzi che vede</text>
<text x="92" y="355" font-size="28" fill="{{ink}}" font-weight="400">il processo</text>
<rect x="92" y="390" width="424" height="72" rx="24" fill="#dbeafe"/>
<text x="116" y="436" font-size="30" fill="{{ink}}" font-weight="400">V1 · pagina virtuale</text>
<rect x="92" y="484" width="424" height="72" rx="24" fill="#ccfbf1"/>
<text x="116" y="530" font-size="30" fill="{{ink}}" font-weight="400">V2 · pagina virtuale</text>
<rect x="92" y="578" width="424" height="72" rx="24" fill="#fef3c7"/>
<text x="116" y="624" font-size="30" fill="{{ink}}" font-weight="400">V3 · pagina virtuale</text>
<text x="92" y="722" font-size="26" fill="{{ink}}" font-weight="400">… molte altre pagine …</text>
<text x="92" y="764" font-size="26" fill="{{ink}}" font-weight="400">Non tutte sono presenti in RAM.</text>
<rect x="644" y="210" width="612" height="390" rx="24" fill="{{surface}}"/>
<text x="674" y="262" font-size="32" fill="{{ink}}" font-weight="700">KERNEL · sistema operativo</text>
<text x="674" y="306" font-size="28" fill="{{ink}}" font-weight="400">Prepara e aggiorna le strutture dati</text>
<rect x="674" y="330" width="552" height="178" rx="24" fill="#e0e7ff"/>
<text x="698" y="370" font-size="28" fill="{{ink}}" font-weight="700">Tabella delle pagine del processo</text>
<text x="714" y="420" font-size="30" fill="{{ink}}" font-weight="400">V1 → F4</text>
<text x="968" y="420" font-size="30" fill="{{ink}}" font-weight="400">V2 → F1</text>
<text x="714" y="472" font-size="30" fill="{{ink}}" font-weight="400">V3 → F6</text>
<text x="674" y="549" font-size="25" fill="{{ink}}" font-weight="400">Gestisce anche quali frame fisici</text>
<text x="674" y="591" font-size="25" fill="{{ink}}" font-weight="400">sono liberi o occupati.</text>
<rect x="644" y="682" width="612" height="188" rx="24" fill="#dbeafe"/>
<text x="674" y="726" font-size="32" fill="{{ink}}" font-weight="700">MMU · hardware della CPU</text>
<text x="674" y="773" font-size="27" fill="{{ink}}" font-weight="400">Usa le corrispondenze per tradurre</text>
<text x="674" y="815" font-size="27" fill="{{ink}}" font-weight="400">un indirizzo virtuale in uno fisico.</text>
<path d="M950 600 V673" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<text x="973" y="640" font-size="23" fill="{{muted}}" font-weight="400">tabelle usate</text>
<rect x="1356" y="210" width="500" height="660" rx="24" fill="{{surface}}"/>
<text x="1384" y="268" font-size="32" fill="{{ink}}" font-weight="700">RAM · MEMORIA FISICA</text>
<text x="1384" y="310" font-size="26" fill="{{ink}}" font-weight="400">Pagine fisiche, dette anche frame</text>
<rect x="1384" y="345" width="444" height="65" rx="24" fill="#ccfbf1"/>
<text x="1408" y="387" font-size="29" fill="{{ink}}" font-weight="400">F1 · contiene V2</text>
<rect x="1384" y="429" width="444" height="65" rx="24" fill="#f1f5f9"/>
<text x="1408" y="471" font-size="29" fill="{{ink}}" font-weight="400">F2 · altro / libero</text>
<rect x="1384" y="513" width="444" height="65" rx="24" fill="#f1f5f9"/>
<text x="1408" y="555" font-size="29" fill="{{ink}}" font-weight="400">F3 · altro / libero</text>
<rect x="1384" y="597" width="444" height="65" rx="24" fill="#dbeafe"/>
<text x="1408" y="639" font-size="29" fill="{{ink}}" font-weight="400">F4 · contiene V1</text>
<rect x="1384" y="681" width="444" height="65" rx="24" fill="#f1f5f9"/>
<text x="1408" y="723" font-size="29" fill="{{ink}}" font-weight="400">F5 · altro / libero</text>
<rect x="1384" y="765" width="444" height="65" rx="24" fill="#fef3c7"/>
<text x="1408" y="807" font-size="29" fill="{{ink}}" font-weight="400">F6 · contiene V3</text>
<path d="M544 800 H634" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1256 800 H1346" fill="none" stroke="{{line}}" stroke-width="5" marker-end="url(#arrow)"/>
<text x="556" y="747" font-size="19" fill="{{muted}}" font-weight="400">indirizzo</text>
<text x="558" y="775" font-size="19" fill="{{muted}}" font-weight="400">virtuale</text>
<text x="1265" y="747" font-size="19" fill="{{muted}}" font-weight="400">indirizzo</text>
<text x="1278" y="775" font-size="19" fill="{{muted}}" font-weight="400">fisico</text>
<rect x="64" y="920" width="1792" height="94" rx="24" fill="{{panel}}"/>
<text x="94" y="977" font-size="28" fill="{{surface}}" font-weight="400">Stesso colore e stessa sigla V: la stessa pagina vista dal programma e collocata nella RAM.</text>
<text x="64" y="1054" font-size="24" fill="{{muted}}" font-weight="400">TPSI 4 · Intel x86-64 · Modello didattico semplificato</text></g></svg>
