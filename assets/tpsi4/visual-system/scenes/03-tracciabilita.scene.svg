<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../03-tracciabilita.svg">
<title id="scene-title">Dal requisito all'evidenza</title>
<desc id="scene-desc">Il requisito di capacità del buffer guida l'implementazione; un test di inserimento a buffer pieno verifica il comportamento; il report documenta l'esito. Gli identificatori collegano i quattro artefatti.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Dal requisito all'evidenza</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Un esempio originale: il buffer non deve superare la capacità N.</text><rect x="64" y="256" width="400" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Requisito R-01</text><use href="#tpsi-requirement" x="174" y="332" width="180" height="140"/><text x="92" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">count non supera N</text><text x="92" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il produttore attende</text><text x="92" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">quando il buffer è pieno</text><rect x="528" y="256" width="400" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="556" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Codice</text><use href="#tpsi-terminal" x="638" y="332" width="180" height="140"/><text x="556" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">put() controlla count</text><text x="556" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Attende con while</text><text x="556" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Aggiorna sotto mutex</text><rect x="992" y="256" width="400" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1020" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Test T-01</text><use href="#tpsi-test" x="1102" y="332" width="180" height="140"/><text x="1020" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Prepara count = N</text><text x="1020" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Prova a inserire</text><text x="1020" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Verifica l'attesa</text><rect x="1456" y="256" width="400" height="568" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1484" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Evidenza E-01</text><use href="#tpsi-document" x="1566" y="332" width="180" height="140"/><text x="1484" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Report della prova</text><text x="1484" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Versione del codice</text><text x="1484" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esito e osservazioni</text><path d="M464 496H520" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M928 496H984" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1392 496H1448" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Se cambia R-01, rivedere codice, test e documentazione collegati.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Una prova passata è un'evidenza; non esaurisce tutti gli interleaving possibili.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 03-tracciabilita</text></g>
</svg>
