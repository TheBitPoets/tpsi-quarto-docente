<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../02-mutex-semaforo.svg">
<title id="scene-title">Mutex e semaforo: due contratti</title>
<desc id="scene-desc">Un mutex protegge l'accesso esclusivo allo stato ed è rilasciato dal proprietario. Un semaforo rappresenta disponibilità: acquisire consuma un permesso, rilasciare ne restituisce uno.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Mutex e semaforo: due contratti</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Scegli la primitiva in base alla regola da esprimere.</text><rect x="64" y="224" width="856" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Mutex · un proprietario</text><use href="#tpsi-mutex" x="402" y="300" width="180" height="140"/><text x="92" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">lock → sezione critica → unlock</text><text x="92" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Protegge un invariante</text><text x="92" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Il proprietario rilascia il mutex</text><text x="92" y="596" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Gli altri thread attendono</text><rect x="976" y="224" width="880" height="632" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1004" y="272" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Semaforo · disponibilità</text><use href="#tpsi-semaphore" x="1326" y="300" width="180" height="140"/><text x="1004" y="476" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Esempio: capacità iniziale N = 3</text><text x="1004" y="516" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">acquire consuma una disponibilità</text><text x="1004" y="556" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">release restituisce una disponibilità</text><text x="1004" y="596" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Può segnalare un evento fra attività</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Un semaforo binario e un mutex non sono automaticamente intercambiabili.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Il contatore deve restare coerente con le risorse o gli eventi rappresentati.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 02-mutex-semaforo</text></g>
</svg>
