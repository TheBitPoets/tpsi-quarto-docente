<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../04-git.svg">
<title id="scene-title">Branch e merge: una storia di snapshot</title>
<desc id="scene-desc">Da C1 parte feature con F1 e F2 mentre main avanza a C2. Dopo review, un merge crea M con genitori C2 e F2. I conflitti eventuali si risolvono prima del commit di merge.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">Branch e merge: una storia di snapshot</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Lettura temporale da sinistra a destra; le linee collegano commit imparentati.</text><rect x="64" y="216" width="1792" height="656" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="104" y="280" fill="{{ink}}" font-size="34" font-weight="400" text-anchor="start">main</text><text x="104" y="600" fill="{{ink}}" font-size="34" font-weight="400" text-anchor="start">feature</text><path d="M360 386H1560M640 386L888 674H1192L1560 386" fill="none" stroke="#64748b" stroke-width="7"/><use href="#tpsi-commit" x="296" y="338" width="128" height="96"/><text x="360" y="478" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="middle">C0</text><use href="#tpsi-commit" x="576" y="338" width="128" height="96"/><text x="640" y="478" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="middle">C1</text><use href="#tpsi-commit" x="1128" y="338" width="128" height="96"/><text x="1192" y="478" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="middle">C2</text><use href="#tpsi-commit" x="1496" y="338" width="128" height="96"/><text x="1560" y="478" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="middle">M</text><use href="#tpsi-commit" x="824" y="626" width="128" height="96"/><text x="888" y="766" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="middle">F1</text><use href="#tpsi-commit" x="1128" y="626" width="128" height="96"/><text x="1192" y="766" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="middle">F2</text><text x="770" y="492" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="start">branch</text><text x="1430" y="594" fill="{{ink}}" font-size="26" font-weight="400" text-anchor="start">review + merge</text><text x="1500" y="824" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="middle">M ha due genitori: C2 e F2</text><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Un branch è un riferimento a un commit: non è una copia permanente dell'intera cartella.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">La pull request organizza review e controlli; non è essa stessa un commit.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 04-git</text></g>
</svg>
