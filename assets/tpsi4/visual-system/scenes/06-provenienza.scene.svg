<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../06-provenienza.svg">
<title id="scene-title">La provenienza resta visibile</title>
<desc id="scene-desc">Libro e documentazione sono riferimenti dichiarati. La bozza originale conserva le fonti; il docente verifica e revisiona; la versione consegnata conserva l'identità e la storia della revisione.</desc>
<defs id="visual-kit-components"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
<g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="{{canvas}}" stroke="none" stroke-width="3"/><text x="64" y="86" fill="{{surface}}" font-size="{{title}}" font-weight="700" text-anchor="start">La provenienza resta visibile</text><text x="64" y="140" fill="{{muted}}" font-size="{{label}}" font-weight="400" text-anchor="start">Separare il riferimento, la produzione della bozza e la revisione.</text><rect x="64" y="256" width="400" height="560" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="92" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Riferimenti</text><use href="#tpsi-document" x="174" y="332" width="180" height="140"/><text x="92" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Libro: copertura</text><text x="92" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Documentazione: API</text><text x="92" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Autore e versione</text><rect x="528" y="256" width="400" height="560" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="556" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Bozza originale</text><use href="#tpsi-artifact" x="638" y="332" width="180" height="140"/><text x="556" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Testo, esempi e figure</text><text x="556" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Trasformazioni dichiarate</text><text x="556" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Eventuale supporto AI</text><rect x="992" y="256" width="400" height="560" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1020" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Revisione</text><use href="#tpsi-user" x="1102" y="332" width="180" height="140"/><text x="1020" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Verifica tecnica</text><text x="1020" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Controllo didattico</text><text x="1020" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Correzioni tracciate</text><rect x="1456" y="256" width="400" height="560" rx="24" fill="{{surface}}" stroke="none" stroke-width="3"/><text x="1484" y="304" fill="{{ink}}" font-size="{{section}}" font-weight="700" text-anchor="start">Versione del corso</text><use href="#tpsi-repository" x="1566" y="332" width="180" height="140"/><text x="1484" y="508" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Materiale revisionato</text><text x="1484" y="548" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Fonti conservate</text><text x="1484" y="588" fill="{{ink}}" font-size="{{label}}" font-weight="400" text-anchor="start">Stato dichiarato</text><path d="M464 496H520" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M928 496H984" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1392 496H1448" fill="none" stroke="{{line}}" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="916" width="1792" height="100" rx="24" fill="{{panel}}" stroke="none" stroke-width="3"/><text x="96" y="958" fill="{{surface}}" font-size="{{label}}" font-weight="400" text-anchor="start">Una bozza prodotta con AI non diventa automaticamente una fonte verificata.</text><text x="96" y="996" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">Il riferimento curricolare non è l'origine testuale delle nostre spiegazioni.</text><text x="64" y="1050" fill="{{muted}}" font-size="{{caption}}" font-weight="400" text-anchor="start">TPSI 4 · Sistemi concorrenti e progettazione · 06-provenienza</text></g>
</svg>
