<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-puntatore-stack-chiamante.svg">
<title id="scene-title">Un puntatore collega due frame dello stesso stack</title><desc id="scene-desc">Durante f, prima di *p = 20, valore nel frame di main si trova a 0x1000 e contiene ancora 10. Il parametro p nel frame di f si trova a 0x0FE8 e contiene 0x1000: una freccia collega questa cella a valore. incremento si trova a 0x0FF0 e contiene 3. Il ritorno a main è conservato a 0x0FF8. La chiamata f(&amp;valore) passa l’indirizzo 0x1000.</desc>
<defs id="visual-kit-components"/><defs><marker id="pointer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="{{data}}"/></marker></defs>

<g font-family="{{family}}"><rect width="1920" height="1080" rx="24" fill="{{canvas}}"/>
<text x="64" y="88" font-size="56" fill="{{surface}}" font-weight="700">Passare un indirizzo: da main a f</text>
<text x="64" y="148" font-size="32" fill="{{muted}}" font-weight="400">Durante f, prima di *p = 20 · indirizzi illustrativi · celle di 8 byte</text>
<rect x="64" y="190" width="1792" height="744" rx="20" fill="{{surface}}"/>
<text x="110" y="257" font-size="44" fill="{{ink}}" font-weight="700">UN SOLO STACK · due frame attivi</text>
<use href="#tpsi-memory" x="1720" y="212" width="86" height="72"/>
<text x="125" y="327" font-size="32" fill="{{ink}}" font-weight="700">Indirizzo</text>
<text x="425" y="327" font-size="32" fill="{{ink}}" font-weight="700">Frame / origine</text>
<text x="770" y="327" font-size="32" fill="{{ink}}" font-weight="700">Variabile e contenuto</text>
<text x="125" y="424" font-size="44" fill="{{ink}}" font-weight="700">0x1000</text>
<text x="425" y="424" font-size="40" fill="{{ink}}" font-weight="700">main</text>
<rect x="720" y="360" width="690" height="100" rx="20" fill="#dbeafe"/>
<text x="760" y="425" font-size="46" fill="{{ink}}" font-weight="700">valore = 10</text>
<text x="125" y="556" font-size="44" fill="{{ink}}" font-weight="700">0x0FF8</text>
<text x="425" y="556" font-size="40" fill="{{ink}}" font-weight="700">chiamata</text>
<rect x="720" y="492" width="690" height="100" rx="20" fill="#fef3c7"/>
<text x="760" y="557" font-size="46" fill="{{ink}}" font-weight="700">ritorno a main</text>
<text x="125" y="688" font-size="44" fill="{{ink}}" font-weight="700">0x0FF0</text>
<text x="425" y="688" font-size="40" fill="{{ink}}" font-weight="700">f</text>
<rect x="720" y="624" width="690" height="100" rx="20" fill="#ccfbf1"/>
<text x="760" y="689" font-size="46" fill="{{ink}}" font-weight="700">incremento = 3</text>
<text x="125" y="820" font-size="44" fill="{{ink}}" font-weight="700">0x0FE8</text>
<text x="425" y="820" font-size="40" fill="{{ink}}" font-weight="700">f</text>
<rect x="720" y="756" width="690" height="100" rx="20" fill="#e0e7ff"/>
<text x="760" y="821" font-size="46" fill="{{ink}}" font-weight="700">p = 0x1000</text>
<path d="M1300 806 H1635 V410 H1414" stroke="{{data}}" stroke-width="8" fill="none" marker-end="url(#pointer-arrow)"/>
<text x="1702" y="782" transform="rotate(-90 1702 782)" font-size="36" fill="{{data}}" font-weight="700">p punta alla cella di valore</text>
<text x="125" y="904" font-size="34" fill="{{ink}}" font-weight="400">RSP → 0x0FE8 · lo stack cresce verso indirizzi minori</text>
<rect x="64" y="956" width="1792" height="64" rx="20" fill="{{panel}}"/>
<text x="96" y="999" font-size="34" fill="{{surface}}" font-weight="400">p contiene 0x1000: scrivere attraverso *p modifica valore nel frame di main.</text>
<text x="64" y="1058" font-size="24" fill="{{muted}}" font-weight="400">TPSI 4 · Puntatori e chiamate · Layout didattico coerente con l’assembly</text>
</g></svg>
