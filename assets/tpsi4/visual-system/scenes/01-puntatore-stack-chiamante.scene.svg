<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-puntatore-stack-chiamante.svg">
<title id="scene-title">Un puntatore collega due frame dello stesso stack</title><desc id="scene-desc">Durante f, valore nel frame di main si trova a 0x1000 e contiene 20. Il parametro p nel frame di f si trova a 0x0FE8 e contiene 0x1000: una freccia collega questa cella a valore. incremento si trova a 0x0FF0 e contiene 3. Il ritorno a main è conservato a 0x0FF8. La chiamata f(&amp;valore) passa l’indirizzo 0x1000.</desc>
<defs id="visual-kit-components"/><defs><marker id="pointer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="{{data}}"/></marker></defs>
<g font-family="{{family}}"><rect width="1920" height="1080" rx="24" fill="{{canvas}}"/>
<text x="64" y="85" font-size="48" fill="{{surface}}" font-weight="700">Passare un indirizzo: da main a f</text>
<text x="64" y="143" font-size="28" fill="{{muted}}" font-weight="400">Durante f, prima della somma · indirizzi illustrativi · ogni cella mostrata occupa 8 byte</text>
<rect x="64" y="200" width="700" height="660" rx="16" fill="{{surface}}"/>
<text x="96" y="253" font-size="36" fill="{{ink}}" font-weight="700">La chiamata in C</text>
<text x="100" y="327" font-size="32" fill="{{ink}}" font-weight="400">main: long valore = 20;</text>
<text x="100" y="387" font-size="42" fill="{{process}}" font-weight="700">f(&amp;valore);</text>
<text x="100" y="445" font-size="32" fill="{{process}}" font-weight="700">&amp;valore = 0x1000</text>
<text x="100" y="505" font-size="30" fill="{{ink}}" font-weight="400">Si copia l’indirizzo nel parametro p.</text>
<text x="100" y="565" font-size="30" fill="{{ink}}" font-weight="400">Non si copia la variabile valore.</text>
<text x="100" y="639" font-size="28" fill="{{ink}}" font-weight="700">p   = 0x1000  →  indirizzo del dato</text>
<text x="100" y="691" font-size="28" fill="{{ink}}" font-weight="700">&amp;p = 0x0FE8  →  indirizzo di p</text>
<text x="100" y="749" font-size="28" fill="{{ink}}" font-weight="700">*p  = 20         →  dato raggiunto</text>
<text x="100" y="815" font-size="28" fill="{{process}}" font-weight="700">Alla fine: *p = 23, quindi valore = 23.</text>
<rect x="812" y="200" width="1044" height="660" rx="16" fill="{{surface}}"/>
<text x="844" y="253" font-size="34" fill="{{ink}}" font-weight="700">UN SOLO STACK · due frame attivi</text>
<use href="#tpsi-memory" x="1738" y="220" width="76" height="65"/>
<text x="846" y="312" font-size="27" fill="{{ink}}" font-weight="700">Indirizzo</text>
<text x="1070" y="312" font-size="27" fill="{{ink}}" font-weight="700">Variabile / contenuto</text>
<text x="846" y="391" font-size="30" fill="{{ink}}" font-weight="700">0x1000</text>
<rect x="1052" y="342" width="554" height="88" rx="16" fill="#dbeafe"/>
<text x="1080" y="396" font-size="34" fill="{{ink}}" font-weight="700">valore = 20</text>
<text x="1630" y="364" font-size="28" fill="{{ink}}" font-weight="400">main</text>
<text x="846" y="519" font-size="30" fill="{{ink}}" font-weight="700">0x0FF8</text>
<rect x="1052" y="470" width="554" height="88" rx="16" fill="#fef3c7"/>
<text x="1080" y="524" font-size="34" fill="{{ink}}" font-weight="700">ritorno a main</text>
<text x="1630" y="492" font-size="28" fill="{{ink}}" font-weight="400">call</text>
<text x="846" y="647" font-size="30" fill="{{ink}}" font-weight="700">0x0FF0</text>
<rect x="1052" y="598" width="554" height="88" rx="16" fill="#ccfbf1"/>
<text x="1080" y="652" font-size="34" fill="{{ink}}" font-weight="700">incremento = 3</text>
<text x="1630" y="620" font-size="28" fill="{{ink}}" font-weight="400">f</text>
<text x="846" y="775" font-size="30" fill="{{ink}}" font-weight="700">0x0FE8</text>
<rect x="1052" y="726" width="554" height="88" rx="16" fill="#e0e7ff"/>
<text x="1080" y="780" font-size="34" fill="{{ink}}" font-weight="700">p = 0x1000</text>
<text x="1630" y="748" font-size="28" fill="{{ink}}" font-weight="400">f</text>
<path d="M1480 770 H1785 V386 H1608" stroke="{{data}}" stroke-width="7" fill="none" marker-end="url(#pointer-arrow)"/>
<text x="1820" y="700" transform="rotate(-90 1820 700)" font-size="26" fill="{{data}}" font-weight="700">p punta a valore</text>
<text x="846" y="845" font-size="25" fill="{{ink}}" font-weight="400">RSP → 0x0FE8 · lo stack cresce verso indirizzi minori</text>
<rect x="64" y="912" width="1792" height="102" rx="16" fill="{{panel}}"/>
<text x="96" y="953" font-size="29" fill="{{surface}}" font-weight="400">La freccia parte dalla cella di p e segue l’indirizzo 0x1000 che vi è conservato.</text>
<text x="96" y="993" font-size="29" fill="{{surface}}" font-weight="400">main resta attivo: f può modificare la sua variabile tramite il puntatore.</text>
<text x="64" y="1053" font-size="24" fill="{{muted}}" font-weight="400">TPSI 4 · Puntatori e chiamate · Layout didattico coerente con l’assembly successivo</text>
</g></svg>
