<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-output="../../01-io-concorrente.svg"><title id="scene-title">Tre attività: la rete aspetta, l’interfaccia risponde</title><desc id="scene-desc">L'attività A legge il sensore e pubblica misure in una coda per B e nell'ultimo valore per C. B invia i dati via socket al server. C legge l'ultimo valore e gestisce lo schermo. Se B aspetta la rete, A può proseguire finché la coda ha spazio e C può rispondere ai comandi.</desc><defs id="visual-kit-components"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="{{line}}"/></marker></defs><g font-family="{{family}}"><rect x="0" y="0" width="1920" height="1080" rx="20" fill="{{canvas}}"/>
<text x="64" y="83" fill="{{surface}}" font-size="46" font-weight="700">Tre attività: la rete aspetta, l’interfaccia risponde</text>
<text x="64" y="140" fill="{{muted}}" font-size="28" font-weight="400">Stessa applicazione · tre thread coordinati · le attese non devono fermare chi può avanzare</text>
<rect x="64" y="200" width="500" height="600" rx="20" fill="{{surface}}"/>
<text x="92" y="248" fill="{{ink}}" font-size="34" font-weight="700">A · Acquisizione</text>
<use href="#tpsi-cpu" x="92" y="275" width="110" height="100"/>
<text x="232" y="305" fill="{{ink}}" font-size="26" font-weight="400">Legge il sensore.</text>
<text x="232" y="343" fill="{{ink}}" font-size="26" font-weight="400">Aspetta la misura</text>
<text x="232" y="381" fill="{{ink}}" font-size="26" font-weight="400">se non è pronta.</text>
<rect x="92" y="437" width="444" height="98" rx="20" fill="#ccfbf1"/>
<text x="110" y="475" fill="{{ink}}" font-size="26" font-weight="400">Quando arriva un dato,</text>
<text x="110" y="513" fill="{{ink}}" font-size="26" font-weight="400">lo pubblica per B e per C.</text>
<text x="92" y="603" fill="{{ink}}" font-size="27" font-weight="400">Durante l’attesa della rete</text>
<text x="92" y="641" fill="{{ink}}" font-size="27" font-weight="400">può leggere altre misure,</text>
<text x="92" y="679" fill="{{ink}}" font-size="27" font-weight="400">finché la coda ha spazio.</text>
<rect x="664" y="200" width="532" height="268" rx="20" fill="{{surface}}"/>
<text x="692" y="248" fill="{{ink}}" font-size="32" font-weight="700">Coda per l’invio</text>
<rect x="692" y="278" width="140" height="62" rx="20" fill="#e0e7ff"/>
<text x="712" y="318" fill="{{ink}}" font-size="26" font-weight="400">22,0 °C</text>
<rect x="846" y="278" width="140" height="62" rx="20" fill="#e0e7ff"/>
<text x="866" y="318" fill="{{ink}}" font-size="26" font-weight="400">22,1 °C</text>
<rect x="1000" y="278" width="140" height="62" rx="20" fill="#e0e7ff"/>
<text x="1020" y="318" fill="{{ink}}" font-size="26" font-weight="400">22,2 °C</text>
<text x="692" y="390" fill="{{ink}}" font-size="26" font-weight="400">Conserva le misure da spedire.</text>
<text x="692" y="428" fill="{{ink}}" font-size="26" font-weight="400">B preleva i dati in ordine.</text>
<rect x="664" y="532" width="532" height="268" rx="20" fill="{{surface}}"/>
<text x="692" y="580" fill="{{ink}}" font-size="30" font-weight="700">Ultimo valore disponibile</text>
<rect x="692" y="610" width="476" height="64" rx="20" fill="#ccfbf1"/>
<text x="722" y="652" fill="{{ink}}" font-size="27" font-weight="400">22,2 °C · orario della misura</text>
<text x="692" y="721" fill="{{ink}}" font-size="26" font-weight="400">C può mostrare l’ultima misura</text>
<text x="692" y="759" fill="{{ink}}" font-size="26" font-weight="400">senza aspettare un dato nuovo.</text>
<rect x="1296" y="200" width="560" height="268" rx="20" fill="{{surface}}"/>
<text x="1324" y="248" fill="{{ink}}" font-size="32" font-weight="700">B · Rete → server</text>
<use href="#tpsi-server" x="1720" y="267" width="100" height="100"/>
<text x="1324" y="307" fill="{{ink}}" font-size="26" font-weight="400">Invia via socket.</text>
<text x="1324" y="345" fill="{{ink}}" font-size="26" font-weight="400">Se il buffer è pieno,</text>
<text x="1324" y="383" fill="{{ink}}" font-size="26" font-weight="400">si blocca questo thread.</text>
<rect x="1324" y="404" width="500" height="43" rx="20" fill="#fef3c7"/>
<text x="1340" y="434" fill="{{ink}}" font-size="24" font-weight="400">ATTESA RETE: B non avanza</text>
<rect x="1296" y="532" width="560" height="268" rx="20" fill="{{surface}}"/>
<text x="1324" y="580" fill="{{ink}}" font-size="32" font-weight="700">C · Interfaccia</text>
<use href="#tpsi-terminal" x="1720" y="609" width="100" height="100"/>
<text x="1324" y="640" fill="{{ink}}" font-size="26" font-weight="400">Mostra il valore e l’orario.</text>
<text x="1324" y="678" fill="{{ink}}" font-size="26" font-weight="400">Gestisce clic e comandi.</text>
<text x="1324" y="716" fill="{{ink}}" font-size="26" font-weight="400">Può segnalare rete lenta.</text>
<path d="M564 338 H656" stroke="{{line}}" fill="none" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M596 338 V666 H656" stroke="{{line}}" fill="none" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1196 338 H1288" stroke="{{line}}" fill="none" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1196 666 H1288" stroke="{{line}}" fill="none" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="64" y="834" width="1792" height="70" rx="20" fill="#ccfbf1"/>
<text x="92" y="880" fill="{{ink}}" font-size="28" font-weight="400">Mentre B aspetta, il sistema può eseguire A oppure C: concorrenza possibile anche con un solo core.</text>
<rect x="64" y="938" width="1792" height="80" rx="20" fill="{{panel}}"/>
<text x="90" y="987" fill="{{surface}}" font-size="26" font-weight="400">La coda è limitata: se la rete resta lenta, serve una regola. L’interfaccia non deve aspettare che si svuoti.</text>
<text x="64" y="1055" fill="{{muted}}" font-size="24" font-weight="400">TPSI 4 · Attesa di I/O e concorrenza · Schema didattico</text></g></svg>
